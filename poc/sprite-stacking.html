<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>POC — sprite stacking</title>
<style>
  html,body{margin:0;height:100%;background:#0e1116;overflow:hidden;font-family:system-ui,sans-serif}
  #c{display:block;width:100%;height:100%}
  #tag{position:fixed;left:10px;top:8px;color:#cfd6e0;font-size:13px;opacity:.85;
       background:#0008;padding:4px 8px;border-radius:6px;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag">Sprite-stacking · пласка форма, екструдована в товщину</div>
<script>
const PAL = { body:'#8a8f98', attack:'#e0483f', armor:'#4a78c8', core:'#f2c14e', leg:'#6b7079' };
const SHAPE = [
  [0,0,'core'],
  [-1,0,'body'],[0,1,'body'],[-1,1,'body'],[1,1,'body'],
  [-1,2,'body'],[0,2,'body'],[1,2,'body'],
  [-2,1,'armor'],[-2,2,'armor'],
  [1,0,'attack'],[2,0,'attack'],[3,0,'attack'],
  [-1,3,'leg'],[1,3,'leg'],
];
const PX = 12, LAYERS = 11, DZ = 2.4;   // extrusion depth

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H; function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;} addEventListener('resize',resize); resize();

function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.min(255,r*f)|0; g=Math.min(255,g*f)|0; b=Math.min(255,b*f)|0;
  return `rgb(${r},${g},${b})`;
}
function tint(c, t){ if(c.enemy){ if(t==='core')return '#b06bd6'; } return PAL[t]; }

function makeCreature(homeX, face, enemy){
  return { homeX, x:homeX, face, enemy, yaw:0, lunge:0 };
}
const A=makeCreature(W*0.34, 1, false), B=makeCreature(W*0.66,-1, true);

let phase='idle', pt=0, attacker=A, defender=B, hitDone=false, shake=0, hitstop=0, t=0;
const debris=[];
function setPhase(p){phase=p;pt=0;hitDone=false;}
function swap(){const x=attacker;attacker=defender;defender=x;}

function hit(){
  const dir=Math.sign(defender.homeX-attacker.homeX)||1;
  defender.lunge += dir*30;
  for(let i=0;i<4;i++) debris.push({x:defender.x, y:H*0.5+(Math.random()-.5)*40,
    vx:dir*(120+Math.random()*160), vy:-(120+Math.random()*200),
    c:tint(defender, Math.random()<.5?'attack':'body'), life:.9});
  shake=8; hitstop=0.05;
}

function update(rdt){
  t+=rdt;
  if(hitstop>0){hitstop-=rdt;return;}
  const dt=Math.min(rdt,0.033); pt+=dt;
  if(phase==='idle'&&pt>0.8) setPhase('approach');
  else if(phase==='approach'&&pt>0.45) setPhase('strike');
  else if(phase==='strike'){ if(!hitDone&&pt>0.11){hit();hitDone=true;} if(pt>0.24) setPhase('recoil'); }
  else if(phase==='recoil'&&pt>0.55){ swap(); setPhase('idle'); }

  const gap=Math.abs(defender.homeX-attacker.homeX)-5*PX;
  const want=(phase==='approach')?0.7:(phase==='strike')?1:0;
  attacker.x += (attacker.homeX + attacker.face*want*gap - attacker.x)*Math.min(1,9*dt);
  defender.x += (defender.homeX + defender.lunge - defender.x)*Math.min(1,9*dt);
  defender.lunge += (0-defender.lunge)*Math.min(1,6*dt);

  for(const c of [A,B]) c.yaw = 0.9*Math.sin(t*0.8 + (c.enemy?1.6:0));
  for(let i=debris.length-1;i>=0;i--){const d=debris[i]; d.vy+=900*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.life-=dt; if(d.life<=0) debris.splice(i,1);}
  shake*=Math.pow(0.0001,dt);
}

function drawCreature(c){
  const cx=c.x, cy=H*0.5, cyaw=Math.cos(c.yaw), syaw=Math.sin(c.yaw);
  // back-to-front
  for(let z=LAYERS-1; z>=0; z--){
    const f = 0.45 + 0.55*(z/(LAYERS-1));          // depth shading
    const zoff = (z-(LAYERS-1)/2)*DZ*syaw;          // depth shifts horizontally with yaw
    for(const [gx,gy,tp] of SHAPE){
      const x = cx + (c.face*gx*PX)*cyaw + zoff;
      const y = cy + gy*PX - 1.6*PX;
      ctx.fillStyle = shade(tint(c,tp), f);
      ctx.fillRect(x-PX/2, y-PX/2, PX+0.6, PX+0.6);
    }
  }
}

function frame(ts){
  const rdt=Math.min(0.05,(frame._p?ts-frame._p:16)/1000); frame._p=ts;
  update(rdt);
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#10151d'); g.addColorStop(1,'#0b0f15');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawCreature(A); drawCreature(B);
  for(const d of debris){ctx.fillStyle=d.c; ctx.globalAlpha=Math.min(1,d.life*2); ctx.fillRect(d.x-3,d.y-3,6,6);} ctx.globalAlpha=1;
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
