/* ============================================================================
   11. COMBAT MODE — clean render + activation popups + buff/debuff tray
   ========================================================================== */
let foeIdx = 0;
function startCombat(){
  APP='combat';
  phase='fight'; winner=null;
  rng = mulberry32(SEED_BASE + foeIdx*101 + 7);
  hero = makeFighter(build.map(p=>({...p})), { id:'hero', name:'«Твій Герой»', side:-1, scale:1.0, accent:'#add0ff' });
  const fe = ROSTER[FOE_ORDER[foeIdx]];
  enemy = makeFighter(fe.build, { id:fe.id, name:fe.name, arch:fe.arch, side:+1, scale:fe.scale, accent:fe.accent });
  hero.homeX=W*0.34; enemy.homeX=W*0.66;
  fighters=[hero,enemy];
  actors.length=0; projectiles.length=0; delayed.length=0;
  particles.length=0; debris.length=0; floaters.length=0; bolts.length=0; slashFX.length=0; popups.length=0;
  log.length=0;
  pushLog(`Бій: ${hero.name} проти ${enemy.name}`, '#9fb0c8');
  hero.atb=0.12; enemy.atb=0.0;
}
let resultT=0, resultText='', resultCol='#ffe24a';
function startResult(){
  phase='result'; resultT=RESULT_DUR;
  const heroWon = winner===hero;
  resultText = heroWon ? `${hero.name} переміг!` : `${enemy.name} переміг!`;
  resultCol = heroWon ? '#7fd0ff' : enemy.accent;
}
function nextFoe(){
  foeIdx=(foeIdx+1)%FOE_ORDER.length;
  startCombat();
}

const log = [];
function pushLog(text, col){ log.push({text, col:col||'#dfe6f0'}); if(log.length>7) log.shift(); }
function addFloater(f, text, col, big){
  floaters.push({ x:creatureScreenX(f), y:ground-3.6*PX*f.scale*combatCellMul()-18, t:0, life: big?1.3:0.95,
    text, col, big:!!big, vy: big?20:34, pop: big?1:0.4 });
}

// trait activation popup near a fighter
function addPopup(f, traitKey){
  const name = popupNameForTrait(traitKey);
  popups.push({ x:creatureScreenX(f), y:ground-3.8*PX*f.scale*combatCellMul()-30, t:0, life:1.2,
    key:traitKey, name, col:traitColor(traitKey) });
  // a little flourish
  const x=creatureScreenX(f), y=ground-3.0*PX*f.scale*combatCellMul();
  burst(x,y,10,[traitColor(traitKey),'#ffffff'],120,-40,3);
}
function popupNameForTrait(k){
  switch(k){
    case 'blade': return '«Лезо» КРИТ!';
    case 'bastion': return '«Бастіон» БЛОК!';
    case 'heart': return '«Серце» +рег';
    case 'kindle': return '«Розпал» +маг';
    case 'flow': return '«Потік» ухил!';
    default: return '«'+k+'»';
  }
}

function consumeEvents(){
  while(events.length){
    const e = events.shift();
    if(e.kind==='telegraph'){ }
    else if(e.kind==='traitProc'){ addPopup(e.f, e.trait); }
    else if(e.kind==='block'){
      addFloater(e.target, 'БЛОК', '#7CE0A0', false);
      pushLog(`${e.target.name}: «Бастіон» заблокував удар`, '#7CE0A0');
      const x=creatureScreenX(e.target), y=ground-3*PX*e.target.scale*combatCellMul();
      // shield-ring flash
      for(let i=0;i<10;i++){ const a=rnd()*6.283;
        particles.push({ x,y, vx:Math.cos(a)*120, vy:Math.sin(a)*120-30, life:0.4, col:'#7CE0A0', sz:2+rnd()*2, grav:60, drag:0.05 }); }
      lightFlash=Math.max(lightFlash,0.3); lightCol='#7CE0A0';
    }
    else if(e.kind==='regen'){
      addFloater(e.f, '+'+e.heal, '#5BE08A', false);
    }
    else if(e.kind==='cast'){
      const sc = SCHOOL[e.school];
      lightFlash=Math.max(lightFlash,0.5); lightCol=sc.light;
      const x=creatureScreenX(e.source), y=ground-3.0*PX*e.source.scale*combatCellMul();
      burst(x,y,10,[sc.col,sc.col2],90,-20,3);
    }
    else if(e.kind==='resolve'){
      const s=e.source, tg=e.target, m=e.move;
      if(e.dodge){
        addFloater(tg, rnd()<0.5?'УХИЛ':'ПРОМАХ', '#9aa6b4', false);
        pushLog(`${tg.name} ${rnd()<0.5?'ухилився':'уник удару'}`, '#9aa6b4');
        spark(creatureScreenX(tg), ground-3*PX*tg.scale*combatCellMul(), 4, '#7e8a99', 90);
      } else {
        if(e.crit){
          addFloater(tg, e.damage+'', '#ffe24a', true);
          triggerSlowmo(SLOWMO_CRIT, 0.55); triggerZoom(ZOOM_PUNCH);
          shake=Math.max(shake,SHAKE_CRIT); hitstop=Math.max(hitstop,HITSTOP_HIT*2.2);
        } else {
          addFloater(tg, e.damage+'', e.shockAmp?'#e6d6ff':'#ffffff', false);
          shake=Math.max(shake, SHAKE_BASE*Math.min(2, e.damage/14));
          hitstop=Math.max(hitstop, HITSTOP_HIT*Math.min(2.2, 0.7+e.damage/26));
        }
        let line = `${s.name} ${m.label}`;
        if(m.school) line += ` [${SCHOOL[m.school].name}]`;
        line += ` — ${e.damage}`;
        if(e.crit) line += ' (КРИТ!)';
        if(e.shockAmp) line += ' ⚡(Шок!)';
        if(e.status) line += `, накладено ${STATUS_DEF[e.status].uk}`;
        pushLog(line, e.crit ? '#ffe24a' : (m.school?SCHOOL[m.school].col:'#dfe6f0'));
        const dir = Math.sign(tg.homeX - s.homeX) || 1;
        tg.knockV += dir*(e.crit?620:380)/Math.max(0.7,tg.scale*0.7);
        for(const p of tg.px){ p.vx += dir*(180+e.damage*6)+(rnd()-.5)*120; p.vy+=(rnd()-.7)*150; }
      }
    }
    else if(e.kind==='statusTick'){
      const def=STATUS_DEF[e.status];
      addFloater(e.target, e.damage+'', def.col, false);
      pushLog(`${e.target.name} ${e.status==='burn'?'горить':'страждає'} — ${e.damage}`, def.col);
      const x=creatureScreenX(e.target), y=ground-2.4*PX*e.target.scale*combatCellMul();
      if(e.status==='burn') burst(x,y,8,['#ff7a2a','#ffd24a'],80,-160,3);
    }
    else if(e.kind==='ko'){
      pushLog(`K.O. — ${e.winner.name} переміг!`, '#ffd24a');
      lightFlash=1; lightCol='#fff';
    }
  }
}

// ---- BUFF/DEBUFF TRAY (separate from HP bar; +green / -red framed) --------
function drawStatusTray(f){
  const sx=creatureScreenX(f)*zoom + (1-zoom)*W/2 + camX;
  // tray sits ABOVE the name+HP-bar cluster (HP name baseline at -52, name top ~-65);
  // -96 puts the 26px chips at -96..-70, clearing the name with a gap (no overlap).
  const top=(ground-lift_(f)-3.4*PX*f.scale*combatCellMul()-96)*zoom + (1-zoom)*H/2 + camY;
  const chip=26, gap=6;
  // order: buffs first, then debuffs
  const sorted=[...f.statuses].sort((a,b)=> (STATUS_DEF[b.key].sign)-(STATUS_DEF[a.key].sign));
  const totalW=sorted.length*(chip+gap)-gap;
  let x=sx-totalW/2; const y=top;
  for(const st of sorted){
    const def=STATUS_DEF[st.key];
    const pos=def.sign>0;
    const frame = pos ? '#3fe08a' : '#e5534b';
    const fillBg = pos ? 'rgba(20,46,30,0.92)' : 'rgba(48,18,18,0.92)';
    const k=Math.max(0.08, st.dur/def.dur);   // countdown -> shrink the fill
    // chip background
    ctx.fillStyle=fillBg; ctx.fillRect(x,y,chip,chip);
    // countdown shrink bar (bottom)
    ctx.fillStyle=pos?'rgba(63,224,138,0.45)':'rgba(229,83,75,0.45)';
    ctx.fillRect(x, y+chip-4, chip*k, 3);
    // +/- frame (thick, instantly distinguishable)
    ctx.strokeStyle=frame; ctx.lineWidth=2.5; ctx.strokeRect(x+1,y+1,chip-2,chip-2);
    // icon: trait icon for buffs, emoji-ish glyph for debuffs (drawn vector)
    if(def.iconTrait){ drawTraitIcon(def.iconTrait, x+chip/2, y+chip/2-1, chip-6, frame); }
    else if(def.glyph==='cross'){ drawTraitIcon('cross', x+chip/2, y+chip/2-1, chip-6, frame); }
    else if(def.glyph==='shield'){ drawTraitIcon('shield', x+chip/2, y+chip/2-1, chip-6, frame); }
    else {
      // debuff emoji glyph
      ctx.font='15px system-ui'; ctx.textAlign='center'; ctx.fillStyle='#fff';
      ctx.fillText(def.glyph, x+chip/2, y+chip/2+5); ctx.textAlign='left';
    }
    // stack count badge
    if(st.stacks>1){
      ctx.font='bold 10px system-ui'; ctx.textAlign='right';
      ctx.fillStyle='#000'; ctx.fillText('×'+st.stacks, x+chip-1, y+chip-2);
      ctx.fillStyle='#fff'; ctx.fillText('×'+st.stacks, x+chip-2, y+chip-3);
      ctx.textAlign='left';
    }
    // +/- corner tag
    ctx.font='bold 11px system-ui'; ctx.textAlign='left';
    ctx.fillStyle=frame; ctx.fillText(pos?'+':'−', x+2, y+11);
    x+=chip+gap;
  }
}

function drawPopups(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const pp of popups){
    const x=pp.x*zoom + (1-zoom)*W/2 + camX;
    const y=pp.y*zoom + (1-zoom)*H/2 + camY;
    const u=pp.t/pp.life;
    const a=Math.min(1,(1-u)*2);
    ctx.globalAlpha=a;
    // icon chip
    const r=15+ (1-Math.min(1,pp.t*4))*8;   // pop-in
    ctx.fillStyle='rgba(8,12,20,0.85)';
    ctx.beginPath(); ctx.arc(x-1, y, r, 0,7); ctx.fill();
    ctx.strokeStyle=pp.col; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x-1,y,r,0,7); ctx.stroke();
    drawTraitIcon(pp.key, x-1, y, r*1.6, lighten(pp.col,0.3));
    // name label
    ctx.font='bold 14px system-ui';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.75)';
    ctx.strokeText(pp.name, x, y-r-10);
    ctx.fillStyle=lighten(pp.col,0.35); ctx.fillText(pp.name, x, y-r-10);
  }
  ctx.globalAlpha=1; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

let camX=0, camY=0;
function lift_(f){ return (1-depthScale(f))*120; }

function drawHPBar(f){
  const sx=creatureScreenX(f)*zoom + (1-zoom)*W/2 + camX;
  const top=(ground-lift_(f)-3.4*PX*f.scale*combatCellMul()-46)*zoom + (1-zoom)*H/2 + camY;
  const bw=120*(f.boss?1.25:1), bh=11, x=sx-bw/2, y=top;
  ctx.font='bold 13px system-ui'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle = f.accent;
  ctx.fillText(f.name, x, y-6);
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(x-2,y-2,bw+4,bh+4);
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillRect(x, y, bw*Math.max(0,f.hpChip)/f.maxHP, bh);
  const frac=Math.max(0,f.hpShown)/f.maxHP;
  const col = frac>0.5?'#56d364':frac>0.25?'#e3b341':'#e5534b';
  ctx.fillStyle=col; ctx.fillRect(x, y, bw*frac, bh);
  ctx.font='9px system-ui'; ctx.fillStyle='#0a0d12';
  ctx.fillText(Math.ceil(Math.max(0,f.hpShown))+'', x+4, y+9);
}
function drawATB(){
  for(const f of fighters){
    if(!f.alive) continue;
    const sx=creatureScreenX(f)*zoom+(1-zoom)*W/2+camX;
    const top=(ground-lift_(f)-3.4*PX*f.scale*combatCellMul()-46)*zoom+(1-zoom)*H/2+camY;
    const bw=120*(f.boss?1.25:1), x=sx-bw/2, y=top+16;
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(x,y,bw,4);
    ctx.fillStyle='#7fc8ff'; ctx.fillRect(x,y,bw*f.atb,4);
  }
}
function drawFloaters(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const fl of floaters){
    const a=Math.min(1, (fl.life-fl.t)*3);
    const x=fl.x*zoom + (1-zoom)*W/2 + camX;
    const y=fl.y*zoom + (1-zoom)*H/2 + camY;
    const pop=1+fl.pop*0.8;
    const size=(fl.big?30:18)*pop;
    ctx.globalAlpha=a;
    ctx.font=`bold ${size}px system-ui`;
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.7)';
    ctx.strokeText(fl.text, x, y);
    ctx.fillStyle=fl.col; ctx.fillText(fl.text, x, y);
  }
  ctx.globalAlpha=1; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}
function drawLog(){
  const w=330, x=W-w-14, lh=19, n=log.length, y0=H-14-n*lh;
  ctx.fillStyle='rgba(8,12,20,0.55)';
  ctx.fillRect(x-8, y0-22, w+8, n*lh+28);
  ctx.fillStyle='rgba(160,180,210,0.5)';
  ctx.font='bold 11px system-ui'; ctx.textAlign='left';
  ctx.fillText('БОЙОВИЙ ЛОГ', x, y0-8);
  ctx.font='12px system-ui';
  for(let i=0;i<n;i++){
    const e=log[i]; const fade=0.4+0.6*((i+1)/n);
    ctx.globalAlpha=fade; ctx.fillStyle=e.col;
    ctx.fillText(e.text, x, y0+i*lh+8);
  }
  ctx.globalAlpha=1;
}
function drawVignetteAndLight(){
  if(lightFlash>0){
    ctx.globalAlpha=lightFlash*0.5;
    const g=ctx.createRadialGradient(W/2,ground-100,40,W/2,H/2,W*0.7);
    g.addColorStop(0,lightCol); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.72);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}
function drawResultBanner(){
  ctx.save();
  ctx.globalAlpha=0.92;
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,ground-150,W,90);
  ctx.textAlign='center';
  ctx.font='bold 42px system-ui'; ctx.fillStyle='#ffe24a';
  ctx.fillText('K.O.', W/2, ground-110);
  ctx.font='bold 22px system-ui'; ctx.fillStyle=resultCol;
  ctx.fillText(resultText, W/2, ground-78);
  ctx.font='14px system-ui'; ctx.fillStyle='#bcd0ee';
  ctx.fillText('наступний суперник за мить…', W/2, ground-50);
  ctx.restore(); ctx.textAlign='left';
}

function drawCombat(rawDt){
  drawArena();
  ctx.save();
  ctx.translate(W/2+camX, H/2+camY);
  ctx.scale(zoom, zoom);
  ctx.translate(-W/2, -H/2);
  for(const f of fighters) drawShadow(f);
  const order=[...fighters].sort((a,b)=>depthScale(a)-depthScale(b));
  for(const f of order) drawCreature(f);
  drawProjectiles();
  drawBolts();
  drawSlashFX(rawDt);
  drawParticles();
  ctx.restore();

  drawVignetteAndLight();
  for(const f of fighters){ if(f.alive){ drawHPBar(f); drawStatusTray(f); } }
  drawATB();
  drawFloaters();
  drawPopups();
  drawLog();
  if(phase==='result') drawResultBanner();

  // combat header (static, top-left)
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.font='bold 13px system-ui'; ctx.fillStyle='#9fb4d6';
  ctx.fillText('БІЙ — LOD: чисті блоки + причинний спалах (без гліфів)', 16, 24);
  // single static buff/debuff legend
  ctx.font='11px system-ui';
  ctx.fillStyle='#3fe08a'; ctx.fillText('▭ зелене = бафф', 16, 42);
  ctx.fillStyle='#e5534b'; ctx.fillText('▭ червоне = дебафф', 132, 42);
}

/* ============================================================================
   12. CAMERA / JUICE
   ========================================================================== */
let timeScale = 1, slowmoT = 0, slowmoTarget = 1;
let zoom = 1, zoomPunch = 0;
function triggerSlowmo(scale, dur){ slowmoTarget=scale; slowmoT=dur; }
function triggerZoom(amount){ zoomPunch=Math.max(zoomPunch, amount); }
function cameraStep(rdt){
  if(slowmoT>0){ slowmoT-=rdt; timeScale += (slowmoTarget-timeScale)*Math.min(1,10*rdt); }
  else timeScale += (1-timeScale)*Math.min(1,6*rdt);
  zoomPunch *= Math.pow(0.0009, rdt);
  const breathe = 1 + ZOOM_BREATH*Math.sin(t*1.3);
  zoom += ((breathe+zoomPunch) - zoom) * Math.min(1, 8*rdt);
}

/* ============================================================================
   13. MAIN LOOP + INPUT + SELF-TESTS
   ========================================================================== */
let mouseX=-1, mouseY=-1;
function setupInput(){
  if(typeof document==='undefined') return;
  const btnAll=document.getElementById('btnAll');
  const btnGo=document.getElementById('btnGo');
  if(btnAll) btnAll.addEventListener('click', ()=>{
    showAllBonds=!showAllBonds;
    btnAll.textContent='всі звʼязки: '+(showAllBonds?'УВІМК':'ВИМК');
  });
  if(btnGo) btnGo.addEventListener('click', ()=>{
    if(APP==='builder'){ startCombat(); btnGo.textContent='назад у білдер ←'; btnGo.className='btn'; }
    else { APP='builder'; recompute(); btnGo.textContent='В бій →'; btnGo.className='btn go'; }
  });

  addEventListener('mousemove', e=>{ mouseX=e.clientX; mouseY=e.clientY; });
  addEventListener('mouseleave', ()=>{ mouseX=-1; mouseY=-1; });
  addEventListener('keydown', e=>{
    if(APP!=='builder') return;
    if(e.key==='['){ builderZoom=Math.max(0.5, builderZoom-0.1); }
    if(e.key===']'){ builderZoom=Math.min(2.0, builderZoom+0.1); }
    if(e.key==='b' || e.key==='B'){ showAllBonds=!showAllBonds; const b=document.getElementById('btnAll'); if(b)b.textContent='всі звʼязки: '+(showAllBonds?'УВІМК':'ВИМК'); }
  });
  cv.addEventListener('click', e=>{
    if(APP!=='builder') return;
    const mx=e.clientX, my=e.clientY;
    // preset buttons
    const pk=presetHit(mx,my); if(pk){ loadPreset(pk); return; }
    // palette
    const ptype=paletteHit(mx,my); if(ptype){ selectedType=ptype; return; }
    // grid: place / remove
    // first, is there a pixel under the click?
    const idx=pixelUnderMouse(mx,my);
    if(idx>=0){ removePixel(idx); return; }
    const {gx,gy}=screenToGrid(mx,my);
    placePixel(gx,gy);
  });
}
function pixelUnderMouse(mx,my){
  const { cell } = builderGeom();
  for(let i=0;i<build.length;i++){
    const p=build[i]; const s=gridToScreen(p.gx,p.gy);
    if(mx>=s.x-cell/2 && mx<=s.x+cell/2 && my>=s.y-cell/2 && my<=s.y+cell/2) return i;
  }
  return -1;
}
function updateBuilderHover(){
  hoverPixIdx=-1; hoverCell=null;
  if(mouseX<0) return;
  hoverPixIdx=pixelUnderMouse(mouseX,mouseY);
  hoverCell=screenToGrid(mouseX,mouseY);
}

function frame(ts){
  const rawDt = Math.min(0.05, (frame._p?ts-frame._p:16)/1000); frame._p=ts;
  t += rawDt;
  cameraStep(rawDt);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);

  if(APP==='builder'){
    updateBuilderHover();
    // gentle idle spring relax of builder pixels not needed (static grid)
    drawBuilder();
  } else {
    let simDt = rawDt * timeScale;
    if(hitstop>0){ hitstop -= rawDt; simDt = 0; }
    if(phase==='fight'){
      if(simDt>0){ stepDelayed(simDt); simStep(simDt); stepFlare(simDt); }
      consumeEvents();
    } else if(phase==='result'){
      consumeEvents();
      if(simDt>0) stepFlare(simDt);
      resultT -= rawDt;
      if(resultT<=0) nextFoe();
    }
    physStep((phase==='fight' && hitstop>0) ? 0 : simDt);
    const shx=(rnd()-.5)*shake, shy=(rnd()-.5)*shake;
    camX=shx; camY=shy;
    drawCombat(rawDt);
  }

  requestAnimationFrame(frame);
}

/* ----------------------------------------------------------------------------
   SELF-TESTS — synergy/shape detectors against known builds. Runs in headless
   Node (no document) AND prints to console in-browser. Returns {pass,fail}.
   ---------------------------------------------------------------------------- */
function runSelfTests(logFn){
  const out = logFn || ((s)=>{ if(typeof console!=='undefined') console.log(s); });
  let pass=0, fail=0;
  function check(name, cond){
    if(cond){ pass++; out('PASS  '+name); }
    else { fail++; out('FAIL  '+name); }
  }
  function traitMag(traits,key){ const t=traits.find(x=>x.key===key); return t?t.magnitude:0; }

  // 1. «Лезо» Force↔Force: a 3-in-a-row horizontal force => 2 bonded pairs
  {
    const b=B([[0,0,'core'],[1,0,'force'],[2,0,'force'],[3,0,'force']]);
    const s=detectSynergies(b);
    check('blade: 3 force in a row -> 2 pairs', traitMag(s,'blade')===2);
  }
  // 2. «Форпост» Plate↔Vital pair
  {
    const b=B([[0,0,'core'],[0,1,'vital'],[1,1,'plate']]);
    const s=detectSynergies(b);
    check('outpost: 1 plate-vital pair', traitMag(s,'outpost')===1);
    // adjacency requires orth touch; diagonal should NOT count
    const b2=B([[0,0,'core'],[0,1,'vital'],[1,2,'plate'],[1,1,'force']]);
    const s2=detectSynergies(b2);
    check('outpost: diagonal does not bond', traitMag(s2,'outpost')===0);
  }
  // 3. «Розпал» Ember↔Mana
  {
    const b=B([[0,0,'core'],[1,0,'ember'],[2,0,'mana']]);
    check('kindle: ember-mana pair', traitMag(detectSynergies(b),'kindle')===1);
  }
  // 4. «Потік» Swift↔Swift
  {
    const b=B([[0,0,'core'],[0,1,'swift'],[1,1,'swift'],[1,0,'swift']]);
    // pairs: (0,1)-(1,1) and (1,1)-(1,0) = 2
    check('flow: L of 3 swift -> 2 pairs', traitMag(detectSynergies(b),'flow')===2);
  }
  // 5. «Підсилення» Catalyst↔element
  {
    const b=B([[0,0,'core'],[1,0,'catalyst'],[2,0,'ember'],[1,1,'frost']]);
    // catalyst touches ember(right) and frost(down) = 2 pairs
    check('amplify: catalyst+2 elements -> 2 pairs', traitMag(detectSynergies(b),'amplify')===2);
  }
  // 6. «Шип» 3+ force line
  {
    const b=B([[0,0,'core'],[0,-1,'force'],[0,-2,'force'],[0,-3,'force']]);
    check('spike: vertical 3 force -> 1 line', traitMag(detectShapes(b),'spike')===1);
    const b2=B([[0,0,'core'],[1,0,'force'],[2,0,'force']]);
    check('spike: only 2 force -> none', traitMag(detectShapes(b2),'spike')===0);
  }
  // 7. «Бастіон» 2x2 plate
  {
    const b=B([[0,0,'core'],[0,1,'plate'],[1,1,'plate'],[0,2,'plate'],[1,2,'plate']]);
    check('bastion: 2x2 plate -> 1 block', traitMag(detectShapes(b),'bastion')===1);
  }
  // 8. «Серце» 5 vital plus
  {
    const b=B([[0,0,'core'],[2,0,'vital'],[2,-1,'vital'],[2,1,'vital'],[1,0,'vital'],[3,0,'vital']]);
    check('heart: vital plus -> 1 cross', traitMag(detectShapes(b),'heart')===1);
  }
  // 9. «Рівновага» mirror symmetry
  {
    const b=B([[0,0,'core'],[-1,0,'force'],[1,0,'force'],[0,1,'vital']]);
    check('balance: symmetric build -> active', traitMag(detectShapes(b),'balance')===1);
    const b2=B([[0,0,'core'],[1,0,'force'],[2,0,'vital'],[-1,0,'force']]);
    check('balance: asymmetric -> inactive', traitMag(detectShapes(b2),'balance')===0);
  }
  // 10. deriveStats folds traits: outpost adds HP
  {
    const base=B([[0,0,'core'],[0,1,'vital'],[0,2,'vital']]);
    const withPlate=B([[0,0,'core'],[0,1,'vital'],[0,2,'vital'],[1,1,'plate'],[1,2,'plate']]);
    const s0=deriveStats(base), s1=deriveStats(withPlate);
    // 2 plate-vital pairs -> +2*7 HP plus 2 vital base equal; compare delta from outpost only is tricky
    check('deriveStats: outpost present in withPlate', s1.traits.some(x=>x.key==='outpost'));
    check('deriveStats: blockChance 0 without bastion', s0.blockChance===0);
  }
  // 11. big preset has many traits & stats sane
  {
    const s=deriveStats(TITAN_BUILD);
    check('titan: >=6 traits active', s.traits.length>=6);
    check('titan: maxHP > base', s.maxHP>60);
    check('titan: has bastion block>0', s.blockChance>0);
    check('titan: has heart regen>0', s.regenPerSec>0);
  }

  out('---- SELF-TESTS: '+pass+' PASS / '+fail+' FAIL ----');
  return { pass, fail };
}

// run tests once at startup (console), then start the loop in-browser
if(typeof document!=='undefined' && document.getElementById && document.getElementById('c') && cv && cv.getContext){
  try { runSelfTests(); } catch(_){}
}

// expose for headless harness
if(typeof module!=='undefined'){ module.exports = { runSelfTests, detectSynergies, detectShapes, deriveStats, deriveMoveset, TITAN_BUILD, B }; }

// boot (guarded so headless stub can require without a real RAF)
if(typeof window!=='undefined' && typeof requestAnimationFrame!=='undefined'){
  setupInput();
  requestAnimationFrame(frame);
}
</script>
