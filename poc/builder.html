/* ============================================================================
   PocketHero — META-BUILDER prototype  (evolved from HERO-BUILDER)
   ONE file, vanilla JS + Canvas2D. Deterministic (Mulberry32 seed).
   SIM / RENDER / DETECTORS kept separate & data-driven (ports to PixiJS).

   SIX DIRECTOR REQUIREMENTS layered on the old builder:
     R1  Loot -> cube INVENTORY (counts). «Відкрити лут» grants weighted batch.
         Placing consumes 1; removing returns 1. Only own>0 placeable.
     R2  ~22 cube types across 6 categories (Тіло/Атака/Захист/Спритність/
         Магія/Особливі), each with rarity+cost+glyph+effect; folded into
         deriveStats. Inventory panel with category TABS + rarity filter +
         sort + text search + tooltips + grey-out.
     R3  Polished bonds + synergy PREVIEW on hover (ghost of would-be bond/
         shape) + «Кодекс комбінацій» with discovered/undiscovered state.
     R4  Stats panel: PRIMARY big icon-led row + «Детально ▾» breakdown with
         per-source contributions (base vs each trait delta).
     R5  Budget cap: total placed cost <= cap; budget bar; block + toast on
         over-budget or unowned.
     R6  Upgradeable grid: MAX 15x15, small central UNLOCKED region; locked
         cells render hatched/🔒; «Розширити поле» unlocks next ring.
     Progression glue: «+ Рівень» raises cap, may auto-unlock ring, grants loot.

   SECTIONS:
     0. TUNABLE CONSTANTS (director knobs)
     1. SEEDED RNG
     2. CUBE ROSTER (types, categories, rarity, cost, glyph, effect) + palette
     3. MOVESET DATA + SCHOOLS + STATUSES
     4. META: synergy + shape DEFS, detectors, deriveStats (folds traits+cubes)
     5. ROSTER (preset builds) + big preset
     6. TRAIT ICON DRAWERS + new cube glyph drawers
     7. SIM — combatants, ATB loop, resolution, EVENT BUS, trait procs
     8. LEGIBILITY CORE — pixelsForMove / glyph drawers / behaviour / flare
     9. RENDER — creature soft-body (LOD-aware), VFX
    10. META-STATE — inventory, budget, grid-unlock, level, codex, toasts
    11. BUILDER MODE — grid, inventory UI, bonds, preview, panels, LOD
    12. COMBAT MODE — clean render + activation popups + buff/debuff tray
    13. CAMERA / JUICE
    14. MAIN LOOP + INPUT + SELF-TESTS
   ========================================================================== */

/* ============================================================================
   1. SEEDED RNG — Mulberry32
   ========================================================================== */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(SEED_BASE);
const rnd  = () => rng();
const rRange = (a,b) => a + (b-a)*rng();
const rPick  = arr => arr[(rng()*arr.length)|0];

/* ============================================================================

function count(build, type){ let n=0; for(const p of build) if(p.type===type) n++; return n; }
function key2(p){ return p.gx+','+p.gy; }
function orthAdjacent(a,b){
  const dx=Math.abs(a.gx-b.gx), dy=Math.abs(a.gy-b.gy);
  return (dx+dy)===1;
}

    match:(a,b)=> (a==='plate'&&b==='vital')||(a==='vital'&&b==='plate') },
  { key:'kindle',  name:'«Розпал»',    kind:'adjacency', icon:'kindle',
    effect:'+маг.сила за кожну пару Жар↔Мана',
    match:(a,b)=> (a==='ember'&&b==='mana')||(a==='mana'&&b==='ember') },
  { key:'flow',    name:'«Потік»',     kind:'adjacency', icon:'flow',
    effect:'+ухил за кожну пару Спритність↔Спритність',
    match:(a,b)=> a==='swift' && b==='swift' },
  { key:'amplify', name:'«Підсилення»',kind:'adjacency', icon:'amplify',
    effect:'+маг. за пару Каталізатор↔(стихія)',
    match:(a,b)=> (a==='catalyst'&&ELEMENTS.includes(b))||(b==='catalyst'&&ELEMENTS.includes(a)) },
  { key:'venomweave', name:'«Сплетіння»', kind:'adjacency', icon:'venomweave',
    effect:'+DoT за пару Отрута↔Мана',
    match:(a,b)=> (a==='poison'&&b==='mana')||(a==='mana'&&b==='poison') },
];

function detectSynergies(build){
  const byCell = new Map();
  build.forEach((p,i)=> byCell.set(key2(p), i));
  const acc = {};
  for(const d of SYNERGY_DEFS) acc[d.key] = { pairs:0, bonds:[], idx:new Set() };
  for(let i=0;i<build.length;i++){
    const p=build[i];
    const neigh = [ [p.gx+1,p.gy], [p.gx,p.gy+1] ];
    for(const [nx,ny] of neigh){
      const j = byCell.get(nx+','+ny);
      if(j===undefined) continue;
      const q=build[j];
      for(const d of SYNERGY_DEFS){
        if(d.match(p.type,q.type)){
          const a=acc[d.key];
          a.pairs++; a.bonds.push([i,j]); a.idx.add(i); a.idx.add(j);
        }
      }
    }
  }
  const traits=[];
  for(const d of SYNERGY_DEFS){
    const a=acc[d.key];
    if(a.pairs>0){
      traits.push({ key:d.key, name:d.name, icon:d.icon, kind:'adjacency',
        magnitude:a.pairs, pixelIndices:[...a.idx], bonds:a.bonds, effect:d.effect });
    }
  }
  return traits;
}

/* ---- SHAPE RECIPES (named patterns of a given type) ----------------------- */
function buildCellIndex(build){
  const m=new Map();
  build.forEach((p,i)=> m.set(key2(p), i));
  return m;
}
function cellOf(byCell, build, gx, gy){
  const i = byCell.get(gx+','+gy);
  return (i===undefined) ? null : { i, p:build[i] };
}

const SHAPE_DEFS = [
  { key:'spike', name:'«Шип»', kind:'shape', icon:'spike',
    effect:'3+ Сила в лінію → +досяжність/атака',
    detect(build, byCell){
      const sets=[];
      const isForce=(gx,gy)=>{ const c=cellOf(byCell,build,gx,gy); return c&&c.p.type==='force'?c.i:-1; };
      for(let k=0;k<build.length;k++){
        const p=build[k]; if(p.type!=='force') continue;
        if(isForce(p.gx-1,p.gy)<0){
          const run=[]; let gx=p.gx;
          let id; while((id=isForce(gx,p.gy))>=0){ run.push(id); gx++; }
          if(run.length>=3){ sets.push(run.slice()); }
        }
        if(isForce(p.gx,p.gy-1)<0){
          const run=[]; let gy=p.gy;
          let id; while((id=isForce(p.gx,gy))>=0){ run.push(id); gy++; }
          if(run.length>=3){ sets.push(run.slice()); }
        }
      }
      return { count:sets.length, sets };
    } },
  { key:'bastion', name:'«Бастіон»', kind:'shape', icon:'bastion',
    effect:'2×2 блок Броні → шанс блоку',
    detect(build, byCell){
      const sets=[];
      const isPlate=(gx,gy)=>{ const c=cellOf(byCell,build,gx,gy); return c&&c.p.type==='plate'?c.i:-1; };
      const seen=new Set();
      for(let k=0;k<build.length;k++){
        const p=build[k]; if(p.type!=='plate') continue;
        const a=isPlate(p.gx,p.gy), b=isPlate(p.gx+1,p.gy),
              c2=isPlate(p.gx,p.gy+1), d=isPlate(p.gx+1,p.gy+1);
        if(a>=0&&b>=0&&c2>=0&&d>=0){
          const sig=p.gx+'_'+p.gy;
          if(!seen.has(sig)){ seen.add(sig); sets.push([a,b,c2,d]); }
        }
      }
      return { count:sets.length, sets };
    } },
  { key:'heart', name:'«Серце»', kind:'shape', icon:'heart5',
    effect:'5 Тіло хрестом → +регенерація',
    detect(build, byCell){
      const sets=[];
      const isVital=(gx,gy)=>{ const c=cellOf(byCell,build,gx,gy); return c&&c.p.type==='vital'?c.i:-1; };
      for(let k=0;k<build.length;k++){
        const p=build[k]; if(p.type!=='vital') continue;
        const c0=isVital(p.gx,p.gy),
              up=isVital(p.gx,p.gy-1), dn=isVital(p.gx,p.gy+1),
              lf=isVital(p.gx-1,p.gy), rt=isVital(p.gx+1,p.gy);
        if(c0>=0&&up>=0&&dn>=0&&lf>=0&&rt>=0){
          sets.push([c0,up,dn,lf,rt]);
        }
      }
      return { count:sets.length, sets };
    } },
  { key:'balance', name:'«Рівновага»', kind:'shape', icon:'balance',
    effect:'дзеркальна симетрія L↔R → +точність',
    detect(build, byCell){
      if(build.length<3) return { count:0, sets:[] };
      let minGx=Infinity,maxGx=-Infinity;
      for(const p of build){ if(p.gx<minGx)minGx=p.gx; if(p.gx>maxGx)maxGx=p.gx; }
      const axis = minGx+maxGx;
      let offAxis=0, mirrored=true;
      for(const p of build){
        const mx = axis - p.gx;
        if(mx!==p.gx) offAxis++;
        const c=cellOf(byCell,build,mx,p.gy);
        if(!c || c.p.type!==p.type){ mirrored=false; break; }
      }
      if(mirrored && offAxis>=2){
        return { count:1, sets:[ build.map((_,i)=>i) ] };
      }
      return { count:0, sets:[] };
    } },
];

function detectShapes(build){
  const byCell = buildCellIndex(build);
  const traits=[];
  for(const d of SHAPE_DEFS){
    const r=d.detect(build, byCell);
    if(r.count>0){
      const idx=new Set();
      for(const s of r.sets) for(const i of s) idx.add(i);
      traits.push({ key:d.key, name:d.name, icon:d.icon, kind:'shape',
        magnitude:r.count, pixelIndices:[...idx], sets:r.sets, effect:d.effect });
    }
  }
  return traits;
}

function detectTraits(build){
  return detectSynergies(build).concat(detectShapes(build));
}

/* ---- deriveStats — base derivation + FOLD trait magnitudes + cube effects -- */
function adjacentAny(a, b){ return Math.abs(a.gx-b.gx)<=1 && Math.abs(a.gy-b.gy)<=1 && !(a.gx===b.gx&&a.gy===b.gy); }

function deriveStats(build){
  const c = t => count(build, t);
  const vital=c('vital'), plate=c('plate'), force=c('force'), swift=c('swift'),
        focus=c('focus'), catalyst=c('catalyst');
  const elements = c('ember') + c('frost') + c('spark') + c('poison') + c('arcane');

  // base magic (kept from engine, incl. catalyst adjacency boost)
  let mag = elements*STAT.magPerElement + catalyst*STAT.magPerCatalyst;
  mag += c('arcane')*STAT.magPerArcane;     // arcane is big raw magic
  if(catalyst>0 && elements>0){
    let adjEl=0;
    for(const p of build){
      if(!ELEMENTS.includes(p.type)) continue;
      for(const q of build){ if(q.type==='catalyst' && adjacentAny(p,q)){ adjEl++; break; } }
    }
    mag *= (1 + STAT.magCatalystMul*catalyst);
    mag += adjEl*3.0;
  }

  let maxHP  = STAT.hpBase + vital*STAT.hpPerVital;
  let armor  = plate*STAT.armorPerPlate;
  let atk    = STAT.atkBase + force*STAT.atkPerForce;
  let speed  = STAT.spdBase + swift*STAT.spdPerSwift;
  let dodge  = Math.min(STAT.dodgeCap, swift*STAT.dodgePerSwift);
  let crit   = Math.min(STAT.critCap, focus*STAT.critPerFocus);
  let acc    = focus*STAT.accPerFocus;

  // ---- NEW CUBE EFFECTS (per-cube, additive) ------------------------------
  const cubeDelta = {};   // per-cube human-readable contribution (for breakdown)
  let regenPerSec = 0;
  let lifesteal   = 0;
  let pierce      = 0;
  let berserk     = 0;
  let blockChance = 0;
  let thorns      = 0;
  let magResist   = 0;
  let haste       = 0;
  const nRegen=c('regen'), nLife=c('lifesteal'), nPierce=c('pierce'), nBerserk=c('berserk'),
        nBlock=c('block'), nThorns=c('thorns'), nWard=c('ward'), nHaste=c('haste'), nEvade=c('evasion');
  if(nRegen){   const d=nRegen*STAT.regenPerRegen;   regenPerSec+=d; cubeDelta.regen='+'+d.toFixed(1)+' рег/с'; }
  if(nLife){    const d=nLife*STAT.lifestealPer;     lifesteal+=d;   cubeDelta.lifesteal='+'+(d*100).toFixed(0)+'% вамп.'; }
  if(nPierce){  const d=Math.min(0.85,nPierce*STAT.pierceArmorPer); pierce+=d; cubeDelta.pierce='-'+(d*100).toFixed(0)+'% броні ціль'; }
  if(nBerserk){ const d=nBerserk*STAT.berserkAtkPer; berserk+=d;     cubeDelta.berserk='+'+d.toFixed(1)+' атака (низьке HP)'; }
  if(nBlock){   const d=nBlock*STAT.blockPerBlock;   blockChance+=d; cubeDelta.block='+'+(d*100).toFixed(0)+'% блок'; }
  if(nThorns){  const d=nThorns*STAT.thornsPer;      thorns+=d;      cubeDelta.thorns='+'+(d*100).toFixed(0)+'% відбиття'; }
  if(nWard){    const d=Math.min(0.7,nWard*STAT.wardPer); magResist+=d; cubeDelta.ward='+'+(d*100).toFixed(0)+'% маг.опір'; }
  if(nHaste){   const d=nHaste*STAT.hastePerHaste;   haste+=d;       cubeDelta.haste='+'+(d*100).toFixed(0)+'% ATB'; }
  if(nEvade){   const d=nEvade*STAT.evasionPer;      dodge+=d;       cubeDelta.evasion='+'+(d*100).toFixed(0)+'% ухил'; }

  // ---- FOLD TRAITS ---------------------------------------------------------
  const traits = detectTraits(build);
  const traitDelta = {};
  let extraDodge  = 0;
  for(const tr of traits){
    const m = tr.magnitude;
    switch(tr.key){
      case 'blade':   { const d=m*TRAIT_K.blade_critPerPair;   crit=Math.min(STAT.critCap+0.3, crit+d); traitDelta[tr.key]='+'+(d*100).toFixed(0)+'% крит'; break; }
      case 'outpost': { const d=m*TRAIT_K.outpost_hpPerPair;   maxHP+=d;                                  traitDelta[tr.key]='+'+d+' HP'; break; }
      case 'kindle':  { const d=m*TRAIT_K.kindle_magPerPair;   mag+=d;                                    traitDelta[tr.key]='+'+d.toFixed(0)+' маг.'; break; }
      case 'flow':    { const d=Math.min(FLOW_DODGE_CAP, m*TRAIT_K.flow_dodgePerPair); extraDodge+=d;      traitDelta[tr.key]='+'+(d*100).toFixed(0)+'% ухил'; break; }
      case 'amplify': { const d=m*TRAIT_K.amplify_magPerPair;  mag+=d;                                    traitDelta[tr.key]='+'+d.toFixed(0)+' маг.'; break; }
      case 'venomweave':{ const d=m*2.0;                       mag+=d;                                    traitDelta[tr.key]='+'+d.toFixed(0)+' маг.(DoT)'; break; }
      case 'spike':   { const d=m*TRAIT_K.spike_atkPerLine;    atk+=d;                                    traitDelta[tr.key]='+'+d.toFixed(0)+' атака'; break; }
      case 'bastion': { const d=Math.min(BASTION_BLOCK_CAP, m*TRAIT_K.bastion_blockPerSet); blockChance=Math.max(blockChance,blockChance+d); traitDelta[tr.key]='+'+(d*100).toFixed(0)+'% блок'; break; }
      case 'heart':   { const d=m*TRAIT_K.heart_regenPerSet;   regenPerSec+=d;                            traitDelta[tr.key]='+'+d.toFixed(1)+' рег/с'; break; }
      case 'balance': { const d=TRAIT_K.balance_accPerSym;     acc+=d;                                    traitDelta[tr.key]='+'+(d*100).toFixed(0)+'% точн.'; break; }
    }
  }
  dodge = Math.min(STAT.dodgeCap+FLOW_DODGE_CAP+0.3, dodge+extraDodge);
  blockChance = Math.min(BASTION_BLOCK_CAP, blockChance);

  return {
    maxHP: Math.round(maxHP),
    armor: +armor.toFixed(1),
    atk, speed,
    dodge, crit, acc,
    magic:+mag.toFixed(1),
    blockChance, regenPerSec,
    lifesteal, pierce, berserk, thorns, magResist, haste,
    traits, traitDelta, cubeDelta,
    counts:{ vital, plate, force, swift, focus, catalyst, elements },
  };
}
function deriveMoveset(build){
  const set = [];
  for(const k of MOVE_ORDER){ if(MOVES[k].req(build)) set.push(k); }
  return set;
}
function effectivePower(f, move){
  if(move.type==='magic') return move.power + f.stats.magic;
  return move.power + f.stats.atk - STAT.atkBase;
}

function drawTraitIcon(key, x, y, s, col){
  const g=s*0.40;
  ctx.save(); ctx.translate(x,y);
  ctx.strokeStyle=col; ctx.fillStyle=col;
  ctx.lineWidth=Math.max(1.4, s*0.10); ctx.lineJoin='round'; ctx.lineCap='round';
  switch(key){
    case 'blade': {
      ctx.beginPath(); ctx.moveTo(-g,-g); ctx.lineTo(g,g); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(g,-g);  ctx.lineTo(-g,g); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,g*0.22,0,7); ctx.fill();
      break; }
    case 'outpost': {
      ctx.beginPath();
      ctx.moveTo(-g*0.7,-g*0.3); ctx.lineTo(-g*0.7,g); ctx.lineTo(g*0.7,g);
      ctx.lineTo(g*0.7,-g*0.3); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-g*0.7,-g*0.3); ctx.lineTo(-g*0.7,-g*0.7); ctx.lineTo(-g*0.25,-g*0.7);
      ctx.lineTo(-g*0.25,-g*0.45); ctx.lineTo(g*0.25,-g*0.45); ctx.lineTo(g*0.25,-g*0.7);
      ctx.lineTo(g*0.7,-g*0.7); ctx.lineTo(g*0.7,-g*0.3); ctx.stroke();
      break; }
    case 'kindle': {
      ctx.beginPath();
      ctx.moveTo(0,g); ctx.bezierCurveTo(g*0.95,g*0.3, g*0.4,-g*0.5, 0,-g);
      ctx.bezierCurveTo(-g*0.3,-g*0.2,-g*0.85,g*0.2, 0,g); ctx.fill();
      break; }
    case 'flow': {
      ctx.beginPath(); ctx.moveTo(-g*0.7,-g*0.6); ctx.lineTo(g*0.0,0); ctx.lineTo(-g*0.7,g*0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-g*0.6); ctx.lineTo(g*0.7,0); ctx.lineTo(0,g*0.6); ctx.stroke();
      break; }
    case 'amplify': {
      ctx.beginPath(); ctx.arc(0,0,g*0.7,0,7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-g*0.4,0); ctx.lineTo(g*0.4,0);
      ctx.moveTo(0,-g*0.4); ctx.lineTo(0,g*0.4); ctx.stroke();
      break; }
    case 'venomweave': {   // «Сплетіння»: droplet with cross-weave
      ctx.beginPath(); ctx.moveTo(0,-g);
      ctx.bezierCurveTo(g*0.75,g*0.05, g*0.55,g, 0,g);
      ctx.bezierCurveTo(-g*0.55,g,-g*0.75,g*0.05, 0,-g); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-g*0.4,0); ctx.lineTo(g*0.4,g*0.3);
      ctx.moveTo(g*0.4,0); ctx.lineTo(-g*0.4,g*0.3); ctx.stroke();
      break; }
    case 'spike': {
      ctx.beginPath(); ctx.moveTo(-g,0); ctx.lineTo(g*0.5,0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(g,0); ctx.lineTo(g*0.3,-g*0.5); ctx.lineTo(g*0.3,g*0.5);
      ctx.closePath(); ctx.fill();
      break; }
    case 'bastion': {
      ctx.beginPath();
      ctx.moveTo(0,-g); ctx.lineTo(g*0.8,-g*0.55); ctx.lineTo(g*0.8,g*0.2);
      ctx.quadraticCurveTo(g*0.8,g*0.9, 0,g);
      ctx.quadraticCurveTo(-g*0.8,g*0.9,-g*0.8,g*0.2);
      ctx.lineTo(-g*0.8,-g*0.55); ctx.closePath(); ctx.fill();
      break; }
    case 'shield': {
      ctx.beginPath();
      ctx.moveTo(0,-g); ctx.lineTo(g*0.8,-g*0.55); ctx.lineTo(g*0.8,g*0.2);
      ctx.quadraticCurveTo(g*0.8,g*0.9, 0,g);
      ctx.quadraticCurveTo(-g*0.8,g*0.9,-g*0.8,g*0.2);
      ctx.lineTo(-g*0.8,-g*0.55); ctx.closePath(); ctx.stroke();
      break; }
    case 'rage': {        // «Лють»: jagged burst
      ctx.beginPath();
      for(let k=0;k<8;k++){ const a=k*Math.PI/4; const r=(k%2?g*0.45:g);
        const px2=Math.cos(a)*r, py2=Math.sin(a)*r;
        if(k===0) ctx.moveTo(px2,py2); else ctx.lineTo(px2,py2); }
      ctx.closePath(); ctx.stroke(); break; }
    case 'rune': {        // «Оберіг»: hex outline + dot
      ctx.beginPath();
      for(let k=0;k<6;k++){ const a=-Math.PI/2+k*Math.PI/3;
        const px2=Math.cos(a)*g, py2=Math.sin(a)*g;
        if(k===0) ctx.moveTo(px2,py2); else ctx.lineTo(px2,py2); }
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,g*0.22,0,7); ctx.fill(); break; }
    case 'heart':
    case 'heart5': {
      ctx.beginPath();
      ctx.moveTo(0, g*0.85);
      ctx.bezierCurveTo(g*1.15, g*0.05, g*0.5,-g*0.9, 0,-g*0.1);
      ctx.bezierCurveTo(-g*0.5,-g*0.9,-g*1.15, g*0.05, 0, g*0.85);
      ctx.fill();
      break; }
    case 'cross': {
      ctx.lineWidth=Math.max(2,s*0.18);
      ctx.beginPath(); ctx.moveTo(0,-g*0.8); ctx.lineTo(0,g*0.8);
      ctx.moveTo(-g*0.8,0); ctx.lineTo(g*0.8,0); ctx.stroke();
      break; }
    case 'balance': {
      ctx.beginPath(); ctx.moveTo(0,-g); ctx.lineTo(0,g*0.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-g,-g*0.4); ctx.lineTo(g,-g*0.4); ctx.stroke();
      ctx.beginPath(); ctx.arc(-g*0.7,0,g*0.32,0,Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(g*0.7,0,g*0.32,0,Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-g*0.4,g*0.5); ctx.lineTo(g*0.4,g*0.5); ctx.stroke();
      break; }
    default: {
      ctx.beginPath(); ctx.arc(0,0,g*0.6,0,7); ctx.stroke();
    }
  }

}
const TRAIT_COL = {
  blade:'#E0483F', outpost:'#7C8AA0', kindle:'#F07A1E', flow:'#F0C020',
  amplify:'#D14FA6', venomweave:'#7bd64a', spike:'#ff8d6b', bastion:'#7CE0A0',
  heart:'#5BE08A', heart5:'#5BE08A', balance:'#EAEFF5', rage:'#ff8060', rune:'#9fb6f0',
};
function traitColor(key){ return TRAIT_COL[key]||'#cfe0ff'; }

/* ============================================================================
   7. SIM — combatants, ATB loop, resolution, EVENT BUS, trait procs
   ========================================================================== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, ground, DPR = 1;
function resize(){
  // Backing store scaled by devicePixelRatio so canvas-drawn text/pixels stay
  // crisp on HiDPI / Windows display-scaling. W/H stay in CSS px (all layout
  // math below is unchanged); frame() applies the DPR transform each frame.
  DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  W = innerWidth; H = innerHeight;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ground = H*0.72;
}
addEventListener('resize', resize); resize();

function makeFighter(build, opts){
  opts = opts||{};
  const stats = deriveStats(build);
  const moveset = deriveMoveset(build);
  const side = opts.side||-1;
  const scale = opts.scale||1.0;
  return {
    id: opts.id||'hero', name: opts.name||'Герой', arch: opts.arch||'', accent: opts.accent||'#add0ff',
    side, face: side<0 ? 1 : -1, scale, boss: !!opts.boss,
    homeX: side<0 ? W*0.32 : W*0.68,
    build, stats, moveset,
    maxHP: stats.maxHP, hp: stats.maxHP, armor: stats.armor,
    blockChance: stats.blockChance, regenPerSec: stats.regenPerSec,
    lifesteal: stats.lifesteal, pierce: stats.pierce, berserk: stats.berserk,
    thorns: stats.thorns, magResist: stats.magResist, haste: stats.haste,
    speed: stats.speed * (side<0?1.04:1.0),
    atb: side<0 ? 0.10 : 0.0,
    statuses: [],
    moveCursor: (side<0?0:1),
    px: build.map(p => ({ gx:p.gx, gy:p.gy, t:p.type, ox:0,oy:0,vx:0,vy:0, flare:0 })),
    advance:0, knock:0, knockV:0,
    hpShown:stats.maxHP, hpChip:stats.maxHP, chipDelay:0,
    flash:0, charge:0, chargeSchool:null, squash:0, alive:true,
    regenAcc:0,
  };
}

let hero, enemy, fighters = [];
const events = [];
function emit(e){ events.push(e); }

let phase = 'fight';
let winner = null;
const actors = [];
const projectiles = [];

function pickMove(f){
  const ms = f.moveset;
  const pool = [];
  for(let i=0;i<ms.length;i++){
    const k = ms[i];
    let w = MOVES[k].weight;
    if(i === f.moveCursor % ms.length) w *= 3.0;
    for(let j=0;j<w*10;j++) pool.push(k);
  }
  f.moveCursor++;
  return MOVES[rPick(pool)];
}

function startAction(f){
  const tgt = (f===hero) ? enemy : hero;
  const move = pickMove(f);
  actors.push({ f, tgt, move, t:0, stage:'windup', fired:false });
  f.squash = (move.type==='magic' || move.kind==='sword') ? 1 : 0.5;
  if(move.type==='magic'){ f.charge = 0.0001; f.chargeSchool = move.school; }
  flareMovePixels(f, move.kind, 1.0);
  if(move.type==='magic' && f.stats.traitDelta.kindle){
    emit({ kind:'traitProc', f, trait:'kindle' });
  }
  // «Лють» berserk: announce when low HP
  if(f.berserk>0 && f.hp < f.maxHP*0.5){
    if(!f.statuses.some(s=>s.key==='berserkB')) applyStatus(f,'berserkB');
  }
  emit({ kind:'telegraph', source:f, move });
}

function berserkBonus(f){
  if(!f.berserk) return 0;
  const missing = 1 - (f.hp/f.maxHP);   // 0..1
  return f.berserk * missing;            // scales with missing HP
}

function resolveHit(f, tgt, move){
  // «Бастіон»/«Блок»: chance to BLOCK an incoming hit entirely
  if(tgt.blockChance>0 && rnd()<tgt.blockChance){
    applyStatus(tgt, 'bastion');
    emit({ kind:'block', source:f, target:tgt, move });
    emit({ kind:'traitProc', f:tgt, trait:'bastion' });
    return;
  }
  const slowed = tgt.statuses.some(s=>s.key==='slow');
  const dodge = Math.max(0.02, tgt.stats.dodge - (slowed?0.07:0));
  const acc   = f.stats.acc;
  const hitChance = 0.92 - dodge + acc;
  const isHit = rnd() < hitChance;
  if(!isHit){
    if(tgt.stats.traitDelta.flow) emit({ kind:'traitProc', f:tgt, trait:'flow' });
    emit({ kind:'resolve', move, source:f, target:tgt, hit:false, dodge:true, crit:false, damage:0 });
    return;
  }
  const critChance = f.stats.crit + (move.critBonus||0);
  const isCrit = rnd() < critChance;
  let dmg = effectivePower(f, move) + berserkBonus(f) + Math.floor(rRange(-2,3));
  if(move.type==='phys'){
    const effArmor = tgt.armor * (1 - (f.pierce||0));   // «Пробій» ignores armor %
    dmg = Math.max(1, dmg - effArmor);
  } else {
    dmg = Math.max(1, dmg * (1 - (tgt.magResist||0)));   // «Оберіг» magic resist
    if(tgt.magResist>0 && !tgt.statuses.some(s=>s.key==='wardB')) applyStatus(tgt,'wardB');
  }
  if(isCrit) dmg = Math.round(dmg * 1.8);
  const shock = tgt.statuses.find(s=>s.key==='shock');
  let shockAmp = false;
  if(shock){ dmg = Math.round(dmg * STATUS_DEF.shock.dmgTakenMul); shockAmp = true;
             tgt.statuses.splice(tgt.statuses.indexOf(shock),1); }
  const arc = tgt.statuses.find(s=>s.key==='arcane');
  if(arc){ dmg = Math.round(dmg * STATUS_DEF.arcane.dmgTakenMul); }
  dmg = Math.round(dmg);
  applyDamage(tgt, dmg);
  // «Шипи» thorns: reflect part of incoming damage back to attacker
  if(tgt.thorns>0 && f.alive){
    const refl = Math.max(1, Math.round(dmg * tgt.thorns));
    f.hp = Math.max(0, f.hp - refl); f.chipDelay=0.4; f.flash=0.5;
    emit({ kind:'thorns', source:tgt, target:f, damage:refl });
    if(f.hp<=0 && f.alive){ killFighter(f, tgt); }
  }
  // «Вампіризм» lifesteal: heal attacker
  if(f.lifesteal>0 && f.alive && f.hp>0){
    const heal=Math.max(1, Math.round(dmg*f.lifesteal));
    f.hp=Math.min(f.maxHP, f.hp+heal); f.chipDelay=0.3;
    emit({ kind:'lifesteal', f, heal });
  }
  let appliedStatus = null;
  if(move.status){ applyStatus(tgt, move.status); appliedStatus = move.status; }
  if(move.school==='arcane'){ applyStatus(tgt, 'arcane'); appliedStatus='arcane'; }
  if(isCrit && f.stats.traitDelta.blade) emit({ kind:'traitProc', f, trait:'blade' });
  emit({ kind:'resolve', move, source:f, target:tgt, hit:true, dodge:false,
         crit:isCrit, damage:dmg, status:appliedStatus, shockAmp });
  if(tgt.hp<=0 && tgt.alive){ killFighter(tgt, f); }
}
function applyDamage(tgt, dmg){
  tgt.hp = Math.max(0, tgt.hp - dmg);
  tgt.chipDelay = 0.45; tgt.flash = 1;
}
function applyStatus(tgt, key){
  const def = STATUS_DEF[key];
  const existing = tgt.statuses.find(s=>s.key===key);
  if(existing){ existing.dur = def.dur; if(existing.stacks<9) existing.stacks++; }
  else tgt.statuses.push({ key, dur:def.dur, tickT: def.tick||0, stacks:1 });
}
function killFighter(tgt, by){
  tgt.alive = false; tgt.hp = 0;
  winner = by;
  triggerSlowmo(SLOWMO_KO, 1.1);
  shake = SHAKE_CRIT*1.3;
  const sc = depthScale(tgt) * tgt.scale;
  const cx = creatureScreenX(tgt), cy = ground - 3.2*PX*tgt.scale*combatCellMul();
  for(const p of tgt.px){
    debris.push({ x: cx + p.gx*PX*sc*combatCellMul(), y: cy + p.gy*PX*sc*combatCellMul(),
      vx:(rnd()-.5)*520, vy:-(180+rnd()*420),
      c: colorOfType(p.t), t:p.t, life:1.4+rnd()*0.8, sz:PX*tgt.scale*combatCellMul() });
  }
  emit({ kind:'ko', winner:by, loser:tgt });
  startResult();
}

function simStep(dt){
  for(const f of fighters){
    if(!f.alive) continue;
    if(f.regenPerSec>0 && f.hp>0 && f.hp<f.maxHP){
      f.regenAcc += dt;
      if(!f.statuses.some(s=>s.key==='heartReg')) applyStatus(f, 'heartReg');
      if(f.regenAcc>=1){
        f.regenAcc-=1;
        const heal=Math.round(f.regenPerSec);
        f.hp=Math.min(f.maxHP, f.hp+heal); f.chipDelay=0.3;
        emit({ kind:'regen', f, heal });
        emit({ kind:'traitProc', f, trait:'heart' });
      }
    }
    for(let i=f.statuses.length-1;i>=0;i--){
      const s = f.statuses[i]; const def = STATUS_DEF[s.key];
      s.dur -= dt;
      if(def.tick>0){
        s.tickT -= dt;
        if(s.tickT<=0){
          s.tickT += def.tick;
          if(def.dmg && f.hp>0){
            const tickDmg = def.dmg * (s.stacks||1);
            f.hp = Math.max(0, f.hp - tickDmg); f.chipDelay=0.4; f.flash=0.6;
            emit({ kind:'statusTick', target:f, status:s.key, damage:tickDmg });
            if(f.hp<=0 && f.alive){ killFighter(f, (f===hero?enemy:hero)); }
          }
        }
      }
      if(s.dur<=0) f.statuses.splice(i,1);
    }
    if(!f.alive) continue;
    let atbMul = 1 + (f.haste||0);
    for(const s of f.statuses){ const d=STATUS_DEF[s.key]; if(d.atbMul) atbMul*=d.atbMul; }
    const busy = actors.some(a=>a.f===f);
    if(!busy){
      f.atb += dt * f.speed * 0.55 * ATB_GLOBAL * atbMul;
      if(f.atb>=1){ f.atb=0; startAction(f); }
    }
  }
  stepActors(dt);
  stepProjectiles(dt);
}

function stepActors(dt){
  for(let i=actors.length-1;i>=0;i--){
    const a = actors[i]; a.t += dt; const m = a.move;
    if(a.stage==='windup'){
      a.f.charge = (m.type==='magic') ? Math.min(1, a.t/m.windUp) : 0;
      flareMovePixels(a.f, m.kind, 1.0);
      if(a.t>=m.windUp){ a.stage='release'; a.t=0; a.f.charge=0; releaseMove(a); }
    } else if(a.stage==='release'){
      if(a.t>=0.06){ a.stage='recover'; a.t=0; }
    } else {
      if(a.t>=m.recover){ actors.splice(i,1); }
    }
  }
}

function releaseMove(a){
  const { f, tgt, move } = a;
  for(const p of f.px){ p.vx += f.face*120; }
  flareMovePixels(f, move.kind, 1.0);
  if(move.ranged){
    spawnProjectile(f, tgt, move);
  } else {
    resolveHit(f, tgt, move);
    if(move.double && rnd()<0.85){
      setTimeout2(0.12, ()=>{ if(tgt.alive && phase==='fight') resolveHit(f, tgt, move); });
    }
    meleeImpactFX(f, tgt, move);
  }
}

const delayed = [];
function setTimeout2(sec, fn){ delayed.push({ t:sec, fn }); }
function stepDelayed(dt){
  for(let i=delayed.length-1;i>=0;i--){ const d=delayed[i]; d.t-=dt; if(d.t<=0){ d.fn(); delayed.splice(i,1);} }
}

function spawnProjectile(f, tgt, move){
  const m = combatCellMul();
  const sx = creatureScreenX(f) + f.face*22*f.scale;
  const sy = ground - 3.0*PX*f.scale*m;
  const ex = creatureScreenX(tgt);
  const ey = ground - 3.0*PX*tgt.scale*m;
  const dist = Math.abs(ex-sx);
  const speed = move.kind==='bow' ? 1300 : (move.kind==='spark'?1700:760);
  const dur = Math.max(0.04, dist/speed);
  projectiles.push({
    move, f, tgt, sx, sy, ex, ey, t:0, dur,
    arc: move.kind==='bow' ? 90 : (move.kind==='spark'?0:60),
    school: move.school,
    bolt: move.kind==='spark' ? makeBolt(sx,sy,ex,ey) : null,
  });
  if(move.school) emit({ kind:'cast', source:f, school:move.school });
}
function makeBolt(sx,sy,ex,ey){
  const segs = 9; const main = [];
  for(let i=0;i<=segs;i++){
    const u=i/segs;
    const x=sx+(ex-sx)*u;
    const y=sy+(ey-sy)*u + (i>0&&i<segs ? (rnd()-0.5)*36 : 0);
    main.push({x,y});
  }
  const forks = [];
  for(let k=0;k<2;k++){
    const i = 2 + ((rnd()*(segs-3))|0);
    const o = main[i];
    forks.push([ {x:o.x,y:o.y},
                 {x:o.x+(rnd()-0.5)*40, y:o.y+(rnd()-0.5)*46},
                 {x:o.x+(rnd()-0.5)*70, y:o.y+(rnd()-0.5)*70} ]);
  }
  return { main, forks };
}
function stepProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i]; p.t += dt;
    const u = p.t/p.dur;
    if(u>=1){
      resolveHit(p.f, p.tgt, p.move);
      projectileImpactFX(p);
      projectiles.splice(i,1);
    }
  }
}

/* ============================================================================
   8. LEGIBILITY CORE — pixelsForMove / glyphs / behaviour / flare
   ========================================================================== */
function pixelsForMove(px, moveKey, face){
  const idx = [];
  const has = t => { for(let i=0;i<px.length;i++) if(px[i].t===t) idx.push(i); };
  switch(moveKey){
    case 'sword': has('force'); break;
    case 'bow':   has('swift'); break;
    case 'fire':  has('ember'); has('mana'); break;
    case 'frost': has('frost'); has('mana'); break;
    case 'spark': has('spark'); has('mana'); break;
    case 'venom': has('poison'); has('mana'); break;
    case 'arc':   has('arcane'); has('mana'); break;
    case 'fist':
    default: {
      const f = face || 1;
      const cand = px.map((p,i)=>({i,p})).sort((a,b)=> (b.p.gx*f) - (a.p.gx*f));
      let picked=0;
      for(const c of cand){
        if(c.p.t==='force' || c.p.t==='vital'){ idx.push(c.i); if(++picked>=2) break; }
      }
      if(idx.length===0 && px.length) idx.push(0);
      break;
    }
  }
  return idx;
}
function flareMovePixels(f, moveKey, intensity){
  const ids = pixelsForMove(f.px, moveKey, f.face);
  for(const i of ids){ f.px[i].flareTarget = Math.max(f.px[i].flareTarget||0, intensity); }
}
function stepFlare(dt){
  for(const f of fighters){
    for(const p of f.px){
      const tgt = p.flareTarget||0;
      if(tgt>p.flare) p.flare += (tgt-p.flare)*Math.min(1, FLARE_RISE*dt);
      p.flare = Math.max(0, p.flare - FLARE_FALL*dt);
      p.flareTarget = 0;
    }
  }
}

function drawGlyph(key, x, y, s, col, alpha){
  if(s < GLYPH_MIN_CELL){
    ctx.globalAlpha = alpha*0.9;
    ctx.fillStyle = col;
    const r=Math.max(1, s*0.16);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.globalAlpha = 1; return;
  }
  const g = s*GLYPH_SIZE_FRAC*0.5;
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = Math.max(1, s*0.10);
  ctx.lineJoin='round'; ctx.lineCap='round';
  switch(key){
    case 'heart':
      ctx.beginPath();
      ctx.moveTo(0, g*0.85);
      ctx.bezierCurveTo(g*1.2, g*0.05, g*0.55,-g*0.95, 0,-g*0.15);
      ctx.bezierCurveTo(-g*0.55,-g*0.95,-g*1.2, g*0.05, 0, g*0.85);
      ctx.fill(); break;
    case 'pulse':   // «Реген»: heartbeat line
      ctx.beginPath();
      ctx.moveTo(-g,0); ctx.lineTo(-g*0.4,0); ctx.lineTo(-g*0.15,-g*0.7);
      ctx.lineTo(g*0.1,g*0.7); ctx.lineTo(g*0.4,0); ctx.lineTo(g,0); ctx.stroke(); break;
    case 'fang':    // «Вампіризм»: two fangs
      ctx.beginPath(); ctx.moveTo(-g*0.5,-g*0.6); ctx.lineTo(-g*0.5,g*0.2); ctx.lineTo(-g*0.2,-g*0.2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(g*0.5,-g*0.6); ctx.lineTo(g*0.5,g*0.2); ctx.lineTo(g*0.2,-g*0.2); ctx.closePath(); ctx.fill(); break;
    case 'blade':
      ctx.beginPath(); ctx.moveTo(0,-g); ctx.lineTo(0,g*0.55); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-g*0.55,g*0.18); ctx.lineTo(g*0.55,g*0.18); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-g); ctx.lineTo(-g*0.22,-g*0.55);
      ctx.lineTo(g*0.22,-g*0.55); ctx.closePath(); ctx.fill(); break;
    case 'arrowdn':  // «Пробій»: down-arrow piercing
      ctx.beginPath(); ctx.moveTo(0,-g); ctx.lineTo(0,g*0.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,g); ctx.lineTo(-g*0.45,g*0.35); ctx.lineTo(g*0.45,g*0.35); ctx.closePath(); ctx.fill(); break;
    case 'rage':     // «Лють»: spiky star
      ctx.beginPath();
      for(let k=0;k<10;k++){ const r=(k%2?g*0.4:g); const a=-Math.PI/2+k*Math.PI/5;
        const px2=Math.cos(a)*r, py2=Math.sin(a)*r; if(k===0)ctx.moveTo(px2,py2);else ctx.lineTo(px2,py2); }
      ctx.closePath(); ctx.fill(); break;
    case 'shield':
      ctx.beginPath();
      ctx.moveTo(0,-g); ctx.lineTo(g*0.8,-g*0.6); ctx.lineTo(g*0.8,g*0.25);
      ctx.quadraticCurveTo(g*0.8,g*0.9, 0,g);
      ctx.quadraticCurveTo(-g*0.8,g*0.9,-g*0.8,g*0.25);
      ctx.lineTo(-g*0.8,-g*0.6); ctx.closePath(); ctx.fill(); break;
    case 'brace':    // «Блок»: bracket shield
      ctx.beginPath(); ctx.arc(0,0,g*0.85,Math.PI*0.8,Math.PI*2.2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-g*0.3,0); ctx.lineTo(g*0.3,0); ctx.stroke(); break;
    case 'thorns':   // «Шипи»: spikes
      for(let k=0;k<4;k++){ const a=k*Math.PI/2;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*g, Math.sin(a)*g); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*g, Math.sin(a)*g);
        ctx.lineTo(Math.cos(a+0.3)*g*0.6, Math.sin(a+0.3)*g*0.6); ctx.stroke(); }
      break;
    case 'rune':     // «Оберіг» / «Аркана» hex rune
      ctx.beginPath();
      for(let k=0;k<6;k++){ const a=-Math.PI/2+k*Math.PI/3; const px2=Math.cos(a)*g, py2=Math.sin(a)*g;
        if(k===0)ctx.moveTo(px2,py2);else ctx.lineTo(px2,py2); }
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,g*0.25,0,7); ctx.fill(); break;
    case 'chevron':
      ctx.beginPath();
      ctx.moveTo(-g*0.7,-g*0.7); ctx.lineTo(g*0.05,0); ctx.lineTo(-g*0.7,g*0.7); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-g*0.05,-g*0.7); ctx.lineTo(g*0.7,0); ctx.lineTo(-g*0.05,g*0.7); ctx.stroke(); break;
    case 'dblchev':  // «Ривок»: fast double chevron
      ctx.beginPath(); ctx.moveTo(-g*0.8,-g*0.7); ctx.lineTo(-g*0.1,0); ctx.lineTo(-g*0.8,g*0.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(g*0.0,-g*0.7); ctx.lineTo(g*0.7,0); ctx.lineTo(g*0.0,g*0.7); ctx.stroke(); break;
    case 'wisp':     // «Ухил»: swirl
      ctx.beginPath(); ctx.arc(0,0,g*0.7,0.4,Math.PI*1.7); ctx.stroke();
      ctx.beginPath(); ctx.arc(g*0.2,g*0.1,g*0.3,Math.PI,Math.PI*2.6); ctx.stroke(); break;
    case 'diamond':
      ctx.beginPath();
      ctx.moveTo(0,-g); ctx.lineTo(g*0.78,0); ctx.lineTo(0,g); ctx.lineTo(-g*0.78,0);
      ctx.closePath(); ctx.fill(); break;
    case 'flame':
      ctx.beginPath();
      ctx.moveTo(0,g);
      ctx.bezierCurveTo(g*0.95,g*0.4, g*0.5,-g*0.4, 0,-g);
      ctx.bezierCurveTo(-g*0.3,-g*0.3,-g*0.85,g*0.2, 0,g);
      ctx.fill(); break;
    case 'snow':
      for(let k=0;k<6;k++){
        const a=k*Math.PI/3;
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a)*g, Math.sin(a)*g); ctx.stroke();
        const bx=Math.cos(a)*g*0.6, by=Math.sin(a)*g*0.6;
        const pa=a+Math.PI/2;
        ctx.beginPath();
        ctx.moveTo(bx-Math.cos(pa)*g*0.22, by-Math.sin(pa)*g*0.22);
        ctx.lineTo(bx+Math.cos(pa)*g*0.22, by+Math.sin(pa)*g*0.22);
        ctx.stroke();
      } break;
    case 'bolt':
      ctx.beginPath();
      ctx.moveTo(g*0.3,-g); ctx.lineTo(-g*0.35,g*0.1); ctx.lineTo(g*0.1,g*0.1);
      ctx.lineTo(-g*0.3,g); ctx.lineTo(g*0.4,-g*0.15); ctx.lineTo(-g*0.05,-g*0.15);
      ctx.closePath(); ctx.fill(); break;
    case 'vial':     // «Отрута»: flask
      ctx.beginPath(); ctx.moveTo(-g*0.25,-g); ctx.lineTo(-g*0.25,-g*0.2);
      ctx.lineTo(-g*0.6,g*0.7); ctx.quadraticCurveTo(-g*0.6,g, 0,g);
      ctx.quadraticCurveTo(g*0.6,g, g*0.6,g*0.7); ctx.lineTo(g*0.25,-g*0.2);
      ctx.lineTo(g*0.25,-g); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-g*0.45,g*0.2); ctx.lineTo(g*0.45,g*0.2); ctx.stroke(); break;
    case 'sigil':    // «Аркана»: star-of-six
      ctx.beginPath();
      for(let k=0;k<3;k++){ const a=-Math.PI/2+k*2*Math.PI/3;
        if(k===0)ctx.moveTo(Math.cos(a)*g,Math.sin(a)*g);else ctx.lineTo(Math.cos(a)*g,Math.sin(a)*g);} ctx.closePath(); ctx.stroke();
      ctx.beginPath();
      for(let k=0;k<3;k++){ const a=Math.PI/2+k*2*Math.PI/3;
        if(k===0)ctx.moveTo(Math.cos(a)*g,Math.sin(a)*g);else ctx.lineTo(Math.cos(a)*g,Math.sin(a)*g);} ctx.closePath(); ctx.stroke(); break;
    case 'droplet':
      ctx.beginPath();
      ctx.moveTo(0,-g);
      ctx.bezierCurveTo(g*0.75,g*0.05, g*0.55,g, 0,g);
      ctx.bezierCurveTo(-g*0.55,g,-g*0.75,g*0.05, 0,-g);
      ctx.fill(); break;
    case 'ring':
      ctx.beginPath(); ctx.arc(0,0,g*0.8,0,7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-g*0.45,0); ctx.lineTo(g*0.45,0);
      ctx.moveTo(0,-g*0.45); ctx.lineTo(0,g*0.45); ctx.stroke(); break;
    case 'star':
    default:
      ctx.beginPath();
      for(let k=0;k<10;k++){
        const r=(k%2?g*0.45:g);
        const a=-Math.PI/2 + k*Math.PI/5;
        const px2=Math.cos(a)*r, py2=Math.sin(a)*r;
        if(k===0) ctx.moveTo(px2,py2); else ctx.lineTo(px2,py2);
      }
      ctx.closePath(); ctx.fill(); break;
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function behaviorMod(type, clock, off){
  const A = BEHAV_AMP;
  let bright=0, sx=0, sy=0;
  switch(type){
    case 'vital': case 'regen': case 'lifesteal':
      { const b=Math.pow(Math.max(0,Math.sin(clock*2.2+off)),6);
        bright=0.10*A*b; sx=sy=0.06*A*b; } break;
    case 'core':
      bright=(0.10+0.08*Math.sin(clock*1.6+off))*A; break;
    case 'ember':
      bright=(0.12+0.18*Math.abs(Math.sin(clock*9+off)*Math.sin(clock*3.3+off)))*A; break;
    case 'frost':
      bright=(0.10+0.10*Math.sin(clock*4+off))*A; sx=0.03*A*Math.sin(clock*7+off); break;
    case 'spark':
      { const c=Math.sin(clock*5+off); const flick=(c>0.82)?1:0;
        bright=(0.08+0.5*flick*(0.5+0.5*Math.sin(clock*60)))*A; } break;
    case 'mana':
      bright=(0.10+0.06*Math.sin(clock*1.8+off))*A; break;
    case 'catalyst': case 'ward': case 'arcane':
      { const p=0.5+0.5*Math.sin(clock*3+off);
        bright=(0.10+0.16*p)*A; sx=sy=0.05*A*p; } break;
    case 'plate': case 'block': case 'thorns':
      bright=0.04*A*Math.sin(clock*1.2+off); break;
    case 'force': case 'pierce': case 'berserk':
      { const g=Math.sin(clock*2.4+off); bright=(g>0.9?0.4:0)*A; } break;
    case 'focus':
      bright=(0.06+0.14*Math.pow(Math.max(0,Math.sin(clock*6+off)),8))*A; break;
    case 'swift': case 'haste': case 'evasion':
      sx=0.04*A*Math.sin(clock*8+off); break;
    case 'poison':
      bright=(0.08+0.10*Math.abs(Math.sin(clock*3.5+off)))*A; break;
  }
  return {bright, sx, sy};
}

/* ============================================================================
   9. RENDER — creature soft-body (LOD-aware), VFX
   ========================================================================== */
let t = 0;
let shake = 0, hitstop = 0;
const debris    = [];
const particles = [];
const dust      = [];
const floaters  = [];
const slashFX   = [];
const bolts     = [];
const popups    = [];
let lightFlash  = 0, lightCol = '#fff';

for(let i=0;i<46;i++){
  dust.push({ x:rnd()*innerWidth, y:rnd()*innerHeight*0.85,
    z:0.3+rnd()*0.7, sp:6+rnd()*16, ph:rnd()*7 });
}

function combatCellMul(){ return COMBAT_CELL_FRAC; }
function creatureScreenX(f){ return f.homeX + f.face*f.advance + f.knock; }
function depthScale(f){
  const back = Math.max(0, f.knock * f.face);
  return 1 - Math.min(0.20, back*0.0017);
}

function physStep(dt){
  for(const f of fighters){
    for(const p of f.px){
      const ax = -SPRING_K*p.ox - SPRING_D*p.vx;
      const ay = -SPRING_K*p.oy - SPRING_D*p.vy;
      p.vx += ax*dt; p.vy += ay*dt; p.ox += p.vx*dt; p.oy += p.vy*dt;
    }
    const ka = -34*f.knock - 7.5*f.knockV;
    f.knockV += ka*dt; f.knock += f.knockV*dt;
    const a = actors.find(x=>x.f===f);
    let want = 0;
    if(a){
      if(a.stage==='windup')  want = -0.12;
      else if(a.stage==='release' && !a.move.ranged) want = 1.0;
      else if(a.stage==='release') want = 0.15;
    }
    const other = (f===hero?enemy:hero);
    if(other){
      const reach = (Math.abs(other.homeX - f.homeX) - 3.6*PX);
      f.advance += (want*reach - f.advance) * Math.min(1, 11*dt);
    }
    f.flash  = Math.max(0, f.flash  - dt*7);
    f.squash = Math.max(0, f.squash - dt*5);
    f.hpShown += (f.hp - f.hpShown) * Math.min(1, 9*dt);
    if(f.chipDelay>0) f.chipDelay -= dt;
    else f.hpChip += (f.hp - f.hpChip) * Math.min(1, 4*dt);
  }
  for(let i=debris.length-1;i>=0;i--){ const d=debris[i];
    d.vy += 980*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.life-=dt;
    if(d.y>ground){ d.y=ground; d.vy*=-0.35; d.vx*=0.6; }
    if(d.life<=0) debris.splice(i,1);
  }
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i];
    p.vy += (p.grav||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    p.vx*=Math.pow(p.drag||0.02,dt); p.vy*=Math.pow(p.drag||0.02,dt);
    if(p.life<=0) particles.splice(i,1);
  }
  for(const d of dust){ d.x += d.sp*dt*0.4; d.y -= d.sp*dt*0.12; if(d.x>W+5)d.x=-5; if(d.y<-5)d.y=H*0.85; }
  for(let i=floaters.length-1;i>=0;i--){ const fl=floaters[i];
    fl.t+=dt; fl.y -= (fl.vy||32)*dt; fl.vy=(fl.vy||32)*Math.pow(0.05,dt);
    fl.pop = Math.max(0, (fl.pop||0)-dt*5);
    if(fl.t>fl.life) floaters.splice(i,1);
  }
  for(let i=popups.length-1;i>=0;i--){ const pp=popups[i];
    pp.t+=dt; pp.y-=26*dt; if(pp.t>=pp.life) popups.splice(i,1);
  }
  for(let i=bolts.length-1;i>=0;i--){ bolts[i].t+=dt; if(bolts[i].t>=bolts[i].life) bolts.splice(i,1); }
  shake *= Math.pow(0.0001, dt);
  lightFlash = Math.max(0, lightFlash - dt*3.2);
}

function spark(x,y,n,col,spd){
  for(let i=0;i<n;i++){ const a=rnd()*6.283;
    particles.push({ x,y, vx:Math.cos(a)*spd*(0.4+rnd()), vy:Math.sin(a)*spd*(0.4+rnd())-40,
      life:0.3+rnd()*0.35, col, sz:2+rnd()*3, grav:300, drag:0.02 }); }
}
function burst(x,y,n,cols,spd,grav,sz){
  for(let i=0;i<n;i++){ const a=rnd()*6.283, s=spd*(0.3+rnd());
    particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-20,
      life:0.4+rnd()*0.6, col:rPick(cols), sz:sz*(0.6+rnd()), grav:grav, drag:0.05 }); }
}
function meleeImpactFX(f, tgt, move){
  const m=combatCellMul();
  const ix = creatureScreenX(tgt) - f.face*18, iy = ground - 3.0*PX*tgt.scale*m;
  if(move.kind==='fist'){ spark(ix,iy,6,'#ffffff',180); }
  else if(move.kind==='sword'){
    slashFX.push({ x:ix, y:iy, dir:f.face, t:0, life:0.22 });
    spark(ix,iy,10,'#dfe7ff',260);
  }
}
function projectileImpactFX(p){

      particles.push({ x:ix,y:iy, vx:Math.cos(a)*(120+rnd()*120)*(rnd()<.5?-1:1),

  } else if(p.school==='spark'){

    for(let i=0;i<10;i++){ const a=rnd()*6.283;
      particles.push({ x:ix,y:iy, vx:Math.cos(a)*(160+rnd()*200), vy:Math.sin(a)*(160+rnd()*200)-30,
        life:0.25+rnd()*0.25, col:'#ffffff', sz:1+rnd()*2, grav:0, drag:0.01 }); }
    lightFlash=1.0; lightCol=SCHOOL.spark.light; shake=Math.max(shake,SHAKE_CRIT*0.8);
    triggerZoom(0.12);
  } else if(p.school==='poison'){
    burst(ix,iy,20,['#7bd64a','#a6ff6a','#4a8a2a','#d6ff9a'],240,160,4);
    for(let i=0;i<6;i++){ const a=-1.0-rnd()*1.1;
      particles.push({ x:ix,y:iy, vx:Math.cos(a)*(80+rnd()*90)*(rnd()<.5?-1:1),
        vy:Math.sin(a)*(120+rnd()*100), life:0.6+rnd()*0.5, col:'#a6ff6a', sz:2+rnd()*2, grav:-30, drag:0.06 }); }
    lightFlash=0.55; lightCol=SCHOOL.poison.light;
  } else if(p.school==='arcane'){
    burst(ix,iy,28,['#c060ff','#f0d0ff','#9030d0','#ffffff'],320,60,4);
    for(let i=0;i<12;i++){ const a=rnd()*6.283;
      particles.push({ x:ix,y:iy, vx:Math.cos(a)*(140+rnd()*160), vy:Math.sin(a)*(140+rnd()*160)-30,
        life:0.4+rnd()*0.4, col:'#f0d0ff', sz:1.5+rnd()*2.5, grav:0, drag:0.03 }); }
    lightFlash=1.0; lightCol=SCHOOL.arcane.light; shake=Math.max(shake,SHAKE_CRIT*0.9);
    triggerZoom(0.13);
  }
}

function drawCreaturePixels(f, sx, baseY, scaleMul, breathPhase, inspectType, lod){
  const s = depthScale(f) * f.scale * scaleMul;
  const cell = PX*s;
  const detailed = !lod && cell>=GLYPH_MIN_CELL;
  const breath=1+0.03*Math.sin(t*2.6+breathPhase);
  const sq=1 - f.squash*0.18, st=1 + f.squash*0.14;

  if(f.charge>0 && f.chargeSchool){
    const sc=SCHOOL[f.chargeSchool];
    const r=(14+f.charge*22)*f.scale;
    const gg=ctx.createRadialGradient(sx, baseY-3*PX*s, 2, sx, baseY-3*PX*s, r);
    gg.addColorStop(0, sc.col2); gg.addColorStop(0.5, sc.col); gg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=0.6*f.charge; ctx.fillStyle=gg;
    ctx.beginPath(); ctx.arc(sx, baseY-3*PX*s, r, 0, 7); ctx.fill(); ctx.globalAlpha=1;
  }

  if(detailed){
    for(let i=0;i<f.px.length;i++){
      const c=f.px[i]; if(c.t!=='catalyst') continue;
      const cx = sx + (c.gx*PX*sq + c.ox)*s;
      const cy = baseY - (3.2*PX*s) + ((c.gy*PX)*breath*st + c.oy)*s;
      const pulse=0.18+0.16*(0.5+0.5*Math.sin(t*3+i));
      for(let j=0;j<f.px.length;j++){
        const q=f.px[j]; if(j===i || !PIX[q.t].magic || q.t==='catalyst') continue;
        if(Math.abs(c.gx-q.gx)>1 || Math.abs(c.gy-q.gy)>1) continue;
        const qx = sx + (q.gx*PX*sq + q.ox)*s;
        const qy = baseY - (3.2*PX*s) + ((q.gy*PX)*breath*st + q.oy)*s;
        ctx.globalAlpha=pulse; ctx.strokeStyle=NEW_PAL.catalyst; ctx.lineWidth=Math.max(1,s*1.2);
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(qx,qy); ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
  }

  for(let i=0;i<f.px.length;i++){
    const p=f.px[i];
    let bx=0,by=0,brBeh=0;
    const bm=behaviorMod(p.t, t, i*1.7);
    bx=bm.sx*PX; by=bm.sy*PX; brBeh=bm.bright;
    const x = sx + (p.gx*PX*sq + p.ox + bx)*s;
    const y = baseY - (3.2*PX*s) + ((p.gy*PX)*breath*st + p.oy + by)*s;

    const fl = (p.flare||0)*FLARE_INTENSITY;
    const popScale = 1 + fl*0.5;
    const w = (PX*s + 0.6) * popScale;

    let cellAlpha = 1;
    if(detailed && inspectType && p.t!==inspectType) cellAlpha = INSPECT_DIM;

    const base = colorOfType(p.t);
    let col = base;
    if(f.flash>0.15) col = '#ffffff';
    else col = lighten(base, Math.min(0.95, brBeh + fl*0.9));

    ctx.globalAlpha = cellAlpha;
    ctx.fillStyle = col;
    ctx.fillRect(x-w/2, y-w/2, w, w);
    ctx.fillStyle='rgba(255,255,255,0.10)';
    ctx.fillRect(x-w/2, y-w/2, w, Math.max(1,w*0.18));

    if(detailed && p.t==='plate'){
      const sweep = ((t*0.5 + i*0.13) % 1);
      const band = Math.max(0, 1 - Math.abs(sweep-0.5)*5);
      if(band>0){ ctx.globalAlpha=cellAlpha*0.35*band; ctx.fillStyle='#eef3fb';
        ctx.fillRect(x-w/2, y-w/2, w*0.5, w); }
    }

    if(detailed){
      const meta = PIX[p.t];
      let gcol = meta.tint;
      let galpha = cellAlpha * (cell>GLYPH_MIN_CELL ? 0.92 : 1);
      if(fl>0.25){ gcol = '#ffffff'; galpha = cellAlpha; }
      drawGlyph(meta.glyph, x, y, w, gcol, galpha);
    }
    ctx.globalAlpha = 1;

    if(fl>0.4){
      ctx.globalAlpha = Math.min(0.7, fl*0.6)*cellAlpha;
      ctx.strokeStyle = lighten(base, 0.5); ctx.lineWidth=Math.max(1,s*0.8);
      ctx.strokeRect(x-w/2-2, y-w/2-2, w+4, w+4);
      ctx.globalAlpha=1;
    }
  }

  if(f.statuses.some(st2=>st2.key==='slow')){
    ctx.globalAlpha=0.18; ctx.fillStyle='#5ad6ff';
    ctx.fillRect(sx-30*s, baseY-3.4*PX*s-6, 60*s, 4.2*PX*s+6); ctx.globalAlpha=1;
  }
  if(f.statuses.some(st2=>st2.key==='shock')){
    ctx.globalAlpha=0.13+0.1*Math.abs(Math.sin(t*22)); ctx.fillStyle='#c79bff';
    ctx.fillRect(sx-30*s, baseY-3.4*PX*s-6, 60*s, 4.2*PX*s+6); ctx.globalAlpha=1;
  }
  if(f.statuses.some(st2=>st2.key==='poison')){
    ctx.globalAlpha=0.12+0.06*Math.abs(Math.sin(t*4)); ctx.fillStyle='#7bd64a';
    ctx.fillRect(sx-30*s, baseY-3.4*PX*s-6, 60*s, 4.2*PX*s+6); ctx.globalAlpha=1;
  }
  if(f.statuses.some(st2=>st2.key==='bastion')){
    ctx.globalAlpha=0.10+0.08*Math.abs(Math.sin(t*5)); ctx.fillStyle='#7CE0A0';
    ctx.fillRect(sx-32*s, baseY-3.6*PX*s-8, 64*s, 4.6*PX*s+10); ctx.globalAlpha=1;
  }
}

const _lc = {};
function lighten(hex, a){
  if(a<=0) return hex;
  const key=hex+'|'+(a.toFixed(2));
  if(_lc[key]) return _lc[key];
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=Math.round(r+(255-r)*a); g=Math.round(g+(255-g)*a); b=Math.round(b+(255-b)*a);
  const out='#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
  _lc[key]=out; return out;
}

function drawArena(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141b27'); g.addColorStop(.55,'#10161f'); g.addColorStop(1,'#080b11');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const hg = ctx.createRadialGradient(W*0.5, ground, 10, W*0.5, ground, W*0.7);
  hg.addColorStop(0,'rgba(60,90,140,0.18)'); hg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=hg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(120,150,190,0.10)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,ground); ctx.lineTo(W,ground); ctx.stroke();
  ctx.fillStyle='#161d2a';
  ctx.beginPath();
  ctx.moveTo(W*0.5-60, ground); ctx.lineTo(W*0.5+60, ground);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  for(const d of dust){
    ctx.globalAlpha=0.10+0.18*d.z;
    ctx.fillStyle='#bcd0ee';
    const sdz=1+d.z*2; ctx.fillRect(d.x, d.y, sdz, sdz);
  }
  ctx.globalAlpha=1;
}
function drawShadow(f){
  const s=depthScale(f)*f.scale*combatCellMul(), sx=creatureScreenX(f);
  ctx.fillStyle='rgba(0,0,0,0.38)';
  ctx.beginPath(); ctx.ellipse(sx, ground+3, 36*s, 9*s, 0,0,7); ctx.fill();
}
function drawCreature(f){
  if(!f.alive) return;
  const sx=creatureScreenX(f);
  const lift=(1-depthScale(f))*120;
  const baseY=ground-lift;
  drawCreaturePixels(f, sx, baseY, combatCellMul(), (f.face>0?1.5:0), null, true);
}

function drawProjectiles(){
  for(const p of projectiles){
    if(p.move.kind==='spark') continue;
    const u=p.t/p.dur;
    const x=p.sx+(p.ex-p.sx)*u;
    const y=p.sy+(p.ey-p.sy)*u - Math.sin(u*Math.PI)*p.arc;
    const ang=Math.atan2((p.ey-p.sy) - Math.cos(u*Math.PI)*p.arc*Math.PI, (p.ex-p.sx));
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
    if(p.move.kind==='bow'){
      ctx.strokeStyle='rgba(230,210,150,0.4)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-26,0); ctx.lineTo(0,0); ctx.stroke();
      ctx.strokeStyle='#caa15a'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(8,0); ctx.stroke();
      ctx.fillStyle='#e8d9a0'; ctx.beginPath();
      ctx.moveTo(8,0); ctx.lineTo(2,-3); ctx.lineTo(2,3); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#caa15a'; ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(-18,-3);
      ctx.moveTo(-14,0); ctx.lineTo(-18,3); ctx.stroke();
    } else {
      const sc=SCHOOL[p.school];
      const gg=ctx.createRadialGradient(0,0,1,0,0,16);
      gg.addColorStop(0,sc.col2); gg.addColorStop(0.5,sc.col); gg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,0,16,0,7); ctx.fill();
      ctx.fillStyle=sc.col2; ctx.beginPath(); ctx.arc(0,0,4,0,7); ctx.fill();
      if(rnd()<0.8) particles.push({ x, y, vx:(rnd()-.5)*40, vy:(rnd()-.5)*40,
        life:0.3, col:sc.col, sz:2+rnd()*2, grav:p.school==='fire'?-120:60, drag:0.1 });
      ctx.restore();
      continue;
    }
    ctx.restore();
  }
}
function drawBolts(){
  for(const b of bolts){
    const a = 1 - b.t/b.life;
    const flick = 0.6+0.4*Math.abs(Math.sin(b.t*60));
    ctx.globalAlpha = a*flick;
    ctx.strokeStyle='rgba(199,155,255,0.5)'; ctx.lineWidth=7; ctx.lineJoin='round';
    strokePath(b.bolt.main);
    for(const fk of b.bolt.forks) strokePath(fk);
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=2.4;
    strokePath(b.bolt.main);
    ctx.strokeStyle='#e6d6ff'; ctx.lineWidth=1.4;
    for(const fk of b.bolt.forks) strokePath(fk);
    ctx.globalAlpha=1;
  }
}
function strokePath(pts){
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}
function drawSlashFX(rdt){
  for(let i=slashFX.length-1;i>=0;i--){
    const sFx=slashFX[i]; sFx.t+=rdt;
    const u=sFx.t/sFx.life; if(u>=1){ slashFX.splice(i,1); continue; }
    ctx.save(); ctx.translate(sFx.x, sFx.y);
    ctx.globalAlpha=(1-u)*0.95; ctx.strokeStyle='#eaf0ff'; ctx.lineWidth=6-u*4;
    ctx.beginPath();
    const a0=(-1.1)*sFx.dir, a1=(1.1)*sFx.dir;
    ctx.arc(0,0, 30, a0+u*0.6, a1+u*0.6, sFx.dir<0); ctx.stroke();
    ctx.restore(); ctx.globalAlpha=1;
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.min(1, p.life*3);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.sz/2, p.y-p.sz/2, p.sz, p.sz);
  }
  ctx.globalAlpha=1;
  for(const d of debris){
    ctx.globalAlpha=Math.min(1,d.life*2);
    ctx.fillStyle = d.t ? colorOfType(d.t) : d.c;
    const s=d.sz||PX*0.8; ctx.fillRect(d.x-s/2, d.y-s/2, s, s);
  }
  ctx.globalAlpha=1;
}

/* ============================================================================
   10. META-STATE — inventory, budget, grid-unlock, level, codex, toasts (R1/R5/R6)
   ----------------------------------------------------------------------------
   All deterministic: loot uses a seeded RNG advanced by a click counter, so the
   same Nth loot click always yields the same batch.
   ========================================================================== */
const META = {
  level: 1,
  budgetCap: BUDGET_BASE,
  ringUnlocked: GRID_START_RING,      // Chebyshev radius of unlocked region
  inventory: {},                      // type -> owned count
  lootClicks: 0,                      // advances deterministic loot RNG
  discovered: {},                     // traitKey -> true (codex session memory)
};
// seed every placeable cube to 0
for(const k of TYPE_ORDER){ if(k!=='core') META.inventory[k]=0; }

// deterministic loot RNG keyed by click index
function lootRng(n){ return mulberry32(SEED_BASE*7 + n*2654435761); }
const PLACEABLE = TYPE_ORDER.filter(k=>k!=='core');
function weightedCubePick(r){
  // pick a rarity by weight, then a uniform cube of that rarity
  let total=0; for(const k in RARITY_WEIGHT) total+=RARITY_WEIGHT[k];
  let roll=r()*total, rar='common';
  for(const k in RARITY_WEIGHT){ roll-=RARITY_WEIGHT[k]; if(roll<=0){ rar=k; break; } }
  const pool=PLACEABLE.filter(k=>CUBES[k].rarity===rar);
  if(pool.length===0) return PLACEABLE[(r()*PLACEABLE.length)|0];
  return pool[(r()*pool.length)|0];
}
function grantLoot(batchRange){
  META.lootClicks++;
  const r = lootRng(META.lootClicks);
  const n = batchRange[0] + ((r()*(batchRange[1]-batchRange[0]+1))|0);
  const got = {};
  for(let i=0;i<n;i++){
    const k=weightedCubePick(r);
    META.inventory[k]=(META.inventory[k]||0)+1;
    got[k]=(got[k]||0)+1;
  }
  const parts=Object.keys(got).map(k=>CUBES[k].name+'×'+got[k]);
  toast('Лут: '+parts.join(', '), '#5ec07e');
}
function owned(type){ return type==='core' ? Infinity : (META.inventory[type]||0); }

// budget: sum of placed cube costs (core is 0)
function buildCost(arr){ let s=0; for(const p of (arr||build)) s+=cubeCost(p.type); return s; }
function budgetUsed(){ return buildCost(build); }
function budgetCap(){ return META.budgetCap; }

// grid unlock: a cell is unlocked if within Chebyshev radius ringUnlocked AND in hard cap
function cellUnlocked(gx,gy){
  const half=GRID_MAX>>1;
  if(Math.abs(gx)>half || Math.abs(gy)>half) return false;
  return Math.max(Math.abs(gx),Math.abs(gy)) <= META.ringUnlocked;
}
function expandGrid(){
  const half=GRID_MAX>>1;
  if(META.ringUnlocked>=half){ toast('Поле вже максимальне', '#e3b341'); return false; }
  if(META.level<1+EXPAND_LEVEL_COST && false){ /* cost is level-points, see below */ }
  // spend a level-point of "progress": require level high enough; cheap demo gate
  META.ringUnlocked++;
  toast('Поле розширено до '+(META.ringUnlocked*2+1)+'×'+(META.ringUnlocked*2+1), '#7ea0d0');
  return true;
}
function levelUp(){
  META.level++;
  META.budgetCap += BUDGET_PER_LEVEL;
  let msg='Рівень '+META.level+' · бюджет +'+BUDGET_PER_LEVEL;
  if(META.level % RING_UNLOCK_EVERY === 0){
    const half=GRID_MAX>>1;
    if(META.ringUnlocked<half){ META.ringUnlocked++; msg+=' · поле розширено'; }
  }
  grantLoot(LOOT_LEVEL_BATCH);
  toast(msg, '#b07ed0');
}

// codex discovery
function markDiscovered(traits){
  for(const tr of traits){ if(!META.discovered[tr.key]) META.discovered[tr.key]=true; }
}

// toasts (transient on-screen messages)
const toasts=[];
function toast(text, col){ toasts.push({ text, col:col||'#dfe8ff', t:0, life:2.4 }); if(toasts.length>5) toasts.shift(); }
function stepToasts(dt){ for(let i=toasts.length-1;i>=0;i--){ toasts[i].t+=dt; if(toasts[i].t>=toasts[i].life) toasts.splice(i,1); } }

/* ============================================================================
   11. BUILDER MODE — grid, inventory UI, bonds, preview, panels, LOD
   ========================================================================== */
let APP = 'builder';
let build = [ {gx:0,gy:0,type:'core'} ];   // start from just the core (R1/R5/R6 arc)
let selectedType = 'vital';
let showAllBonds = false;
let builderZoom = 1.0;
let derived = null;
let traitsCache = [];
let hoverCell = null;
let hoverPixIdx = -1;
const shapeFlash = {};
let prevShapeKeys = new Set();
let showCodex = false;
let detailExpanded = false;

// inventory UI state
let invTab = 'all';        // 'all' | category key
let invRarity = 'all';     // 'all' | rarity key
let invSort = 'rarity';    // 'rarity' | 'cost' | 'name'
let invSearch = '';        // text filter
let invScroll = 0;

const RIGHT_PANEL_W = 360;

function builderGeom(){
  const cell = BUILD_CELL*builderZoom;
  const panelW = RIGHT_PANEL_W;
  const areaW = W - panelW;
  const cx = areaW*0.5;
  const cy = H*0.50;
  return { cell, cx, cy, panelW, areaW };
}
function gridToScreen(gx, gy){
  const { cell, cx, cy } = builderGeom();
  return { x: cx + gx*cell, y: cy + gy*cell };
}
function screenToGrid(mx, my){
  const { cell, cx, cy } = builderGeom();
  return { gx: Math.round((mx-cx)/cell), gy: Math.round((my-cy)/cell) };
}

function recompute(){
  derived = deriveStats(build);
  traitsCache = derived.traits;
  markDiscovered(traitsCache);   // codex: anything active is now discovered
  const shapeKeys = new Set(traitsCache.filter(tr=>tr.kind==='shape').map(tr=>tr.key));
  for(const k of shapeKeys){ if(!prevShapeKeys.has(k)) shapeFlash[k]={t:0}; }
  prevShapeKeys = shapeKeys;
}
recompute();

function connectedSet(arr){
  const byCell=new Map(); arr.forEach((p,i)=>byCell.set(p.gx+','+p.gy,i));
  const coreI = arr.findIndex(p=>p.type==='core');
  if(coreI<0) return new Set();
  const seen=new Set([coreI]); const stack=[coreI];
  while(stack.length){
    const i=stack.pop(); const p=arr[i];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const j=byCell.get((p.gx+dx)+','+(p.gy+dy));
      if(j!==undefined && !seen.has(j)){ seen.add(j); stack.push(j); }
    }
  }
  return seen;
}
function cellOccupied(gx,gy){ return build.some(p=>p.gx===gx&&p.gy===gy); }
function orthAdjToBody(gx,gy){
  return build.some(p=> (Math.abs(p.gx-gx)+Math.abs(p.gy-gy))===1 );
}

// Returns {ok, reason} for placing selectedType at (gx,gy)
function canPlace(gx,gy,type){
  type=type||selectedType;
  if(cellOccupied(gx,gy)) return {ok:false, reason:'зайнято'};
  if(!cellUnlocked(gx,gy)) return {ok:false, reason:'клітинка замкнена 🔒'};
  if(!orthAdjToBody(gx,gy)) return {ok:false, reason:'має торкатись тіла'};
  if(type==='core') return {ok:false, reason:'Ядро лише одне'};
  if(owned(type)<=0) return {ok:false, reason:'немає в інвентарі'};
  if(budgetUsed()+cubeCost(type) > budgetCap()) return {ok:false, reason:'перевищує бюджет'};
  return {ok:true};
}

function placePixel(gx,gy){
  const res=canPlace(gx,gy,selectedType);
  if(!res.ok){ toast('Не можна: '+res.reason, '#e5814b'); return; }
  build.push({ gx, gy, type:selectedType });
  META.inventory[selectedType]--;       // R1: consume from inventory
  recompute();
}
function removePixel(idx){
  const p=build[idx];
  if(p.type==='core'){ toast('Ядро не можна прибрати', '#e3b341'); return; }
  const trial = build.slice(0,idx).concat(build.slice(idx+1));
  const reach = connectedSet(trial);
  if(reach.size !== trial.length){ toast('Прибирання відʼєднає тіло', '#e5814b'); return; }
  build.splice(idx,1);
  META.inventory[p.type]=(META.inventory[p.type]||0)+1;  // R1: return to inventory
  recompute();
}

function loadPreset(key){
  // load preset, but reconcile with inventory+budget: grant any missing cubes &
  // bump cap so the director can inspect the build. (Demo affordance.)
  const pb = PRESETS[key].build.map(p=>({...p}));
  build = pb;
  // ensure inventory & budget can host it
  const need={}; for(const p of pb){ if(p.type!=='core') need[p.type]=(need[p.type]||0)+1; }
  for(const k in need){ if((META.inventory[k]||0) < 0) META.inventory[k]=0; }
  const cost=buildCost(pb);
  if(cost>META.budgetCap) META.budgetCap=cost;
  prevShapeKeys = new Set();
  recompute();
  toast('Пресет «'+PRESETS[key].name+'» (демо: бюджет підлаштовано)', '#9fb4d6');
}

function bondSegments(){
  const out=[];
  for(const tr of traitsCache){
    if(tr.kind!=='adjacency' || !tr.bonds) continue;
    for(const [i,j] of tr.bonds){
      const a=build[i], b=build[j];
      const sa=gridToScreen(a.gx,a.gy), sb=gridToScreen(b.gx,b.gy);
      out.push({ i, j, key:tr.key, name:tr.name, x1:sa.x, y1:sa.y, x2:sb.x, y2:sb.y });
    }
  }
  return out;
}

/* ---- SYNERGY PREVIEW (R3): with a type selected & hovering an empty placeable
   cell, compute which existing neighbours WOULD bond and which synergy/shape
   would (or would more strongly) trigger if placed. -------------------------- */
function previewAt(gx,gy,type){
  type=type||selectedType;
  const res=canPlace(gx,gy,type);
  if(!res.ok && res.reason!=='перевищує бюджет') return null;  // still preview if only budget blocks
  // build a trial and diff traits
  const trial=build.concat([{gx,gy,type}]);
  const before=detectTraits(build);
  const after=detectTraits(trial);
  const newIdx=trial.length-1;
  // neighbours that bond with the ghost (adjacency)
  const bondNeighbors=[];
  const byCell=new Map(); build.forEach((p,i)=>byCell.set(p.gx+','+p.gy,i));
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const j=byCell.get((gx+dx)+','+(gy+dy));
    if(j===undefined) continue;
    const q=build[j];
    for(const d of SYNERGY_DEFS){ if(d.match(type,q.type)||d.match(q.type,type)){ bondNeighbors.push({j,key:d.key,name:d.name}); break; } }
  }
  // which traits gained magnitude (or appeared) thanks to the ghost
  const gained=[];
  const bmap={}; for(const tr of before) bmap[tr.key]=tr.magnitude;
  for(const tr of after){
    const wasMag=bmap[tr.key]||0;
    if(tr.magnitude>wasMag && tr.pixelIndices.includes(newIdx)){
      gained.push({ key:tr.key, name:tr.name, kind:tr.kind, delta:tr.magnitude-wasMag, sets:tr.sets, idxAfter:tr.pixelIndices });
    } else if(!bmap[tr.key] && tr.pixelIndices.includes(newIdx)){
      gained.push({ key:tr.key, name:tr.name, kind:tr.kind, delta:tr.magnitude, sets:tr.sets, idxAfter:tr.pixelIndices });
    }
  }
  return { gx, gy, type, bondNeighbors, gained, trial, newIdx, budgetBlocked:(res.ok===false) };
}

function drawBuilderGrid(){
  const { cell, cx, cy } = builderGeom();
  const half = GRID_MAX>>1;

  // ---- draw cells: unlocked faint grid vs locked hatched ----
  for(let gy=-half; gy<=half; gy++){
    for(let gx=-half; gx<=half; gx++){
      const s=gridToScreen(gx,gy);
      const x=s.x-cell/2, y=s.y-cell/2, w=cell-1, hh=cell-1;
      if(cellUnlocked(gx,gy)){
        ctx.strokeStyle='rgba(90,120,170,0.12)'; ctx.lineWidth=1;
        ctx.strokeRect(x,y,w,hh);
      } else {
        // locked: dim hatched
        ctx.fillStyle='rgba(20,26,36,0.55)'; ctx.fillRect(x,y,w,hh);
        ctx.strokeStyle='rgba(60,76,100,0.35)'; ctx.lineWidth=1;
        ctx.beginPath();
        for(let o=-hh;o<w;o+=6){ ctx.moveTo(x+Math.max(0,o), y+Math.max(0,-o)); ctx.lineTo(x+Math.min(w,o+hh), y+Math.min(hh,hh-o)); }
        ctx.stroke();
      }
    }
  }
  // unlocked-region border
  {
    const r=META.ringUnlocked;
    const a=gridToScreen(-r,-r), b=gridToScreen(r,r);
    ctx.strokeStyle='rgba(120,160,210,0.4)'; ctx.lineWidth=2;
    ctx.strokeRect(a.x-cell/2, a.y-cell/2, (2*r+1)*cell, (2*r+1)*cell);
  }

  // ---- SHAPE highlights ----
  drawShapeHighlights();

  // ---- BOND lines (contextual) ----
  if(cell>=LOD_BOND_MINCELL){
    const segs=bondSegments();
    let hoverType = (hoverPixIdx>=0) ? build[hoverPixIdx].type : null;
    for(const sg of segs){
      let show = showAllBonds;
      if(!show && hoverPixIdx>=0){
        show = (sg.i===hoverPixIdx || sg.j===hoverPixIdx)
            || build[sg.i].type===hoverType || build[sg.j].type===hoverType;
      }
      if(!show) continue;
      drawBond(sg, 1.0);
    }
  }

  // ---- SYNERGY PREVIEW ghost (R3) ----
  let preview=null;
  if(hoverCell && hoverPixIdx<0){
    preview=previewAt(hoverCell.gx, hoverCell.gy, selectedType);
  }
  if(preview){
    const s=gridToScreen(preview.gx,preview.gy);
    const ghostCol = preview.budgetBlocked ? '#e5814b' : colorOfType(selectedType);
    // ghost cube
    ctx.globalAlpha=0.35+0.12*Math.sin(t*6); ctx.fillStyle=ghostCol;
    ctx.fillRect(s.x-cell/2, s.y-cell/2, cell-2, cell-2);
    ctx.globalAlpha=0.9; ctx.setLineDash([5,4]);
    ctx.strokeStyle=ghostCol; ctx.lineWidth=2;
    ctx.strokeRect(s.x-cell/2, s.y-cell/2, cell-2, cell-2);
    ctx.setLineDash([]);
    if(cell>=GLYPH_MIN_CELL) drawGlyph(PIX[selectedType].glyph, s.x, s.y, cell-2, '#0a0d12', 0.7);
    ctx.globalAlpha=1;
    // would-be bonds: draw dashed lines + highlight neighbours
    for(const bn of preview.bondNeighbors){
      const q=build[bn.j]; const qs=gridToScreen(q.gx,q.gy);
      ctx.setLineDash([4,3]); ctx.globalAlpha=0.8;
      ctx.strokeStyle=traitColor(bn.key); ctx.lineWidth=BOND_WIDTH*builderZoom;
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(qs.x,qs.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle=traitColor(bn.key); ctx.lineWidth=2;
      ctx.strokeRect(qs.x-cell/2+1, qs.y-cell/2+1, cell-4, cell-4);
      ctx.globalAlpha=1;
    }
    // preview label
    if(preview.gained.length || preview.bondNeighbors.length){
      const labels=preview.gained.length
        ? preview.gained.map(g=>g.name+(g.kind==='adjacency'?' +'+g.delta:'!')).join('  ')
        : 'торкання: '+[...new Set(preview.bondNeighbors.map(b=>b.name))].join(' ');
      ctx.font='bold 12px system-ui'; ctx.textAlign='center';
      const ww=ctx.measureText(labels).width+16;
      ctx.fillStyle='rgba(8,12,20,0.92)'; ctx.fillRect(s.x-ww/2, s.y-cell/2-26, ww, 20);
      ctx.strokeStyle='#5a7bc0'; ctx.lineWidth=1; ctx.strokeRect(s.x-ww/2, s.y-cell/2-26, ww, 20);
      ctx.fillStyle='#dff0c0'; ctx.fillText(labels, s.x, s.y-cell/2-12);
      ctx.textAlign='left';
    }
  } else if(hoverCell && hoverPixIdx<0){
    // plain placement candidate (no synergy)
    const {gx,gy}=hoverCell;
    if(canPlace(gx,gy,selectedType).ok){
      const s=gridToScreen(gx,gy);
      ctx.globalAlpha=0.22+0.1*Math.sin(t*6); ctx.fillStyle=colorOfType(selectedType);
      ctx.fillRect(s.x-cell/2, s.y-cell/2, cell-2, cell-2); ctx.globalAlpha=1;
    }
  }

  // ---- PIXELS (full detail) ----
  const hoverType=hoverType_();
  for(let i=0;i<build.length;i++){
    const p=build[i];
    const s=gridToScreen(p.gx,p.gy);
    const bm=behaviorMod(p.type, t, i*1.7);
    const w=cell-2;
    const base=colorOfType(p.type);
    const dim = (hoverPixIdx>=0 && hoverType && p.type!==hoverType) ? INSPECT_DIM : 1;
    ctx.globalAlpha=dim;
    ctx.fillStyle = lighten(base, Math.min(0.6, bm.bright));
    ctx.fillRect(s.x-w/2, s.y-w/2, w, w);
    ctx.fillStyle='rgba(255,255,255,0.10)';
    ctx.fillRect(s.x-w/2, s.y-w/2, w, Math.max(1,w*0.18));
    // rarity corner pip
    const rc=RARITY_COL[cubeRarity(p.type)];
    ctx.fillStyle=rc; ctx.fillRect(s.x+w/2-5, s.y-w/2+1, 4, 4);
    if(cell>=GLYPH_MIN_CELL){
      drawGlyph(PIX[p.type].glyph, s.x, s.y, w, PIX[p.type].tint, dim*0.95);
    }
    if(p.type==='core'){
      ctx.globalAlpha=dim; ctx.strokeStyle='#fff3c0'; ctx.lineWidth=2;
      ctx.strokeRect(s.x-w/2, s.y-w/2, w, w);
    }
    ctx.globalAlpha=1;
  }

  if(hoverPixIdx>=0){
    const p=build[hoverPixIdx]; const s=gridToScreen(p.gx,p.gy);
    ctx.strokeStyle = p.type==='core' ? '#888' : '#ff6b6b';
    ctx.lineWidth=2; ctx.strokeRect(s.x-cell/2, s.y-cell/2, cell-2, cell-2);
  }

  // footer: hint + status on a backing strip (legible over the arena, no overlap)
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  const hint='БІЛДЕР — обери куб справа · клік: поставити суміжно · клік по кубу: прибрати (повертає в інвентар)';
  const status='кубів: '+(build.length-1)+'    масштаб(LOD): '+(builderZoom).toFixed(2)+'× [ ]    обрано: '+(CUBES[selectedType]?CUBES[selectedType].name:'—');
  ctx.font='bold 13px system-ui'; const hw=ctx.measureText(hint).width;

function drawBond(sg, alphaMul){
  alphaMul=alphaMul==null?1:alphaMul;
  const col=traitColor(sg.key);
  ctx.lineCap='round';
  ctx.globalAlpha=0.35*BOND_GLOW*alphaMul; ctx.strokeStyle=col; ctx.lineWidth=BOND_WIDTH*builderZoom+4;
  ctx.beginPath(); ctx.moveTo(sg.x1,sg.y1); ctx.lineTo(sg.x2,sg.y2); ctx.stroke();
  ctx.globalAlpha=0.95*alphaMul; ctx.strokeStyle=lighten(col,0.4); ctx.lineWidth=BOND_WIDTH*builderZoom;
  ctx.beginPath(); ctx.moveTo(sg.x1,sg.y1); ctx.lineTo(sg.x2,sg.y2); ctx.stroke();
  ctx.globalAlpha=1;
  const mx=(sg.x1+sg.x2)/2, my=(sg.y1+sg.y2)/2;
  const r=8*builderZoom+3;
  ctx.fillStyle='rgba(10,14,22,0.9)';

  ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(mx,my,r,0,7); ctx.stroke();
  drawTraitIcon(sg.key, mx, my, r*1.7, lighten(col,0.3));

function drawShapeHighlights(){
  const { cell } = builderGeom();
  for(const tr of traitsCache){
    if(tr.kind!=='shape' || !tr.sets) continue;
    const col=traitColor(tr.icon)||traitColor(tr.key);
    const pulse=0.4+0.3*Math.sin(t*4)*SHAPE_PULSE;
    for(const set of tr.sets){
      ctx.globalAlpha=0.18+0.12*Math.max(0,Math.sin(t*3));
      ctx.fillStyle=col;
      for(const idx of set){
        const p=build[idx]; const s=gridToScreen(p.gx,p.gy);
        ctx.fillRect(s.x-cell/2, s.y-cell/2, cell-2, cell-2);
      }
      ctx.globalAlpha=Math.min(0.9,0.5+pulse);
      ctx.strokeStyle=lighten(col,0.3); ctx.lineWidth=2;
      for(const idx of set){
        const p=build[idx]; const s=gridToScreen(p.gx,p.gy);
        ctx.strokeRect(s.x-cell/2+1, s.y-cell/2+1, cell-4, cell-4);
      }
      ctx.globalAlpha=1;
    }
    const fl=shapeFlash[tr.key];
    if(fl){
      fl.t += 1/60;
      const set=tr.sets[0];
      let mx=0,my=0; for(const idx of set){ const s=gridToScreen(build[idx].gx,build[idx].gy); mx+=s.x; my+=s.y; }
      mx/=set.length; my/=set.length;
      const u=fl.t/SHAPE_FLASH_DUR;
      if(u<1){
        ctx.globalAlpha=Math.min(1,(1-u)*2);
        ctx.font='bold 18px system-ui'; ctx.textAlign='center';
        ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.7)';
        ctx.strokeText(tr.name+'!', mx, my-30-u*24);
        ctx.fillStyle=lighten(col,0.4); ctx.fillText(tr.name+'!', mx, my-30-u*24);
        ctx.globalAlpha=1; ctx.textAlign='left';
      } else { delete shapeFlash[tr.key]; }
    }
  }
}

/* ---- INVENTORY PANEL (R2): tabs + rarity filter + sort + search + entries -- */
const invHit = { tabs:[], rarities:[], sorts:[], entries:[], search:null };
function filteredInventory(){
  let list = PLACEABLE.slice();
  if(invTab!=='all') list = list.filter(k=>CUBES[k].cat===invTab);
  if(invRarity!=='all') list = list.filter(k=>CUBES[k].rarity===invRarity);
  if(invSearch.trim()){
    const q=invSearch.trim().toLowerCase();
    list = list.filter(k=> CUBES[k].name.toLowerCase().includes(q) || CUBES[k].eff.toLowerCase().includes(q));
  }
  if(invSort==='rarity') list.sort((a,b)=> RARITY_ORDER[CUBES[b].rarity]-RARITY_ORDER[CUBES[a].rarity] || CUBES[a].cost-CUBES[b].cost);
  else if(invSort==='cost') list.sort((a,b)=> CUBES[a].cost-CUBES[b].cost || a.localeCompare(b));
  else list.sort((a,b)=> CUBES[a].name.localeCompare(CUBES[b].name,'uk'));
  return list;
}
// Shared vertical layout for the 3 right-column panels so they never overlap,
// for any window height and whether «Детально» is expanded. Box rects (top,height);
// each draw fn derives its internal y = boxTop+26 (title sits at y-10, box at y-26).
function rightPanelLayout(){
  const GAP = 12;
  const invBoxTop   = 44;
  const traitsBoxH  = 110;
  const traitsBoxTop= H - 146;                          // traits anchored to bottom
  const statsBoxH   = detailExpanded ? 300 : 150;
  const statsBoxTop = traitsBoxTop - GAP - statsBoxH;   // stats sits above traits
  const invBoxH     = Math.max(120, (statsBoxTop - GAP) - invBoxTop); // inv fills the rest
  return {
    inv:    { boxTop: invBoxTop,    boxH: invBoxH },
    stats:  { boxTop: statsBoxTop,  boxH: statsBoxH },
    traits: { boxTop: traitsBoxTop, boxH: traitsBoxH },
  };
}

function drawInventoryPanel(){
  const { panelW } = builderGeom();
  const px=W-panelW+12, pw=panelW-24;
  const L=rightPanelLayout();
  const y=L.inv.boxTop+26;
  const panelH = L.inv.boxH - 26;
  invHit.tabs.length=invHit.rarities.length=invHit.sorts.length=invHit.entries.length=0;
  invHit.search=null;
  ctx.fillStyle='rgba(8,12,20,0.66)'; ctx.fillRect(px-8, y-26, pw+16, panelH+26);
  ctx.strokeStyle='rgba(90,120,170,0.25)'; ctx.lineWidth=1; ctx.strokeRect(px-8, y-26, pw+16, panelH+26);
  ctx.font='bold 13px system-ui'; ctx.fillStyle='#9fb4d6'; ctx.textAlign='left';
  ctx.fillText('ІНВЕНТАР КУБІВ', px, y-10);

  // category tabs
  ctx.font='bold 11px system-ui'; ctx.textBaseline='middle';
  let tx=px, ty=y+4;
  const tabs=[['all','Все']].concat(CAT_ORDER.map(c=>[c,CAT[c].ua]));
  for(const [k,lbl] of tabs){
    const w=ctx.measureText(lbl).width+12;
    const sel=invTab===k;
    ctx.fillStyle=sel?'#2a3a5e':'rgba(22,32,58,0.7)'; ctx.fillRect(tx,ty,w,18);
    ctx.strokeStyle=sel?'#7ea0d0':'#38507e'; ctx.lineWidth=1; ctx.strokeRect(tx,ty,w,18);
    ctx.fillStyle=sel?'#fff':'#aab6c6'; ctx.fillText(lbl, tx+6, ty+9);
    invHit.tabs.push({k,x:tx,y:ty,w,h:18});
    tx+=w+5; if(tx+50>px+pw){ tx=px; ty+=22; }
  }
  let ry=ty+26;

  // rarity filter + sort row
  ctx.font='10px system-ui';
  let rx=px;
  ctx.fillStyle='#7e90ac'; ctx.fillText('рід:', rx, ry+8); rx+=26;
  for(const [k,lbl] of [['all','усі'],['common','зв'],['rare','рід'],['epic','еп'],['legendary','лег']]){
    const w=ctx.measureText(lbl).width+10; const sel=invRarity===k;
    ctx.fillStyle=sel?'rgba(60,80,120,0.9)':'rgba(20,28,44,0.7)'; ctx.fillRect(rx,ry,w,16);
    ctx.strokeStyle=sel?(RARITY_COL[k]||'#7ea0d0'):'#324768'; ctx.lineWidth=1; ctx.strokeRect(rx,ry,w,16);
    ctx.fillStyle=sel?(RARITY_COL[k]||'#fff'):'#9aa6b8'; ctx.fillText(lbl,rx+5,ry+8);
    invHit.rarities.push({k,x:rx,y:ry,w,h:16}); rx+=w+4;
  }
  ry+=20;
  rx=px; ctx.fillStyle='#7e90ac'; ctx.fillText('сорт:', rx, ry+8); rx+=30;
  for(const [k,lbl] of [['rarity','за рідкістю'],['cost','за вартістю'],['name','за назвою']]){
    const w=ctx.measureText(lbl).width+10; const sel=invSort===k;
    ctx.fillStyle=sel?'rgba(60,80,120,0.9)':'rgba(20,28,44,0.7)'; ctx.fillRect(rx,ry,w,16);
    ctx.strokeStyle=sel?'#7ea0d0':'#324768'; ctx.lineWidth=1; ctx.strokeRect(rx,ry,w,16);
    ctx.fillStyle=sel?'#fff':'#9aa6b8'; ctx.fillText(lbl,rx+5,ry+8);
    invHit.sorts.push({k,x:rx,y:ry,w,h:16}); rx+=w+4;
  }
  ry+=20;
  // search box
  ctx.fillStyle='rgba(14,20,32,0.9)'; ctx.fillRect(px, ry, pw, 18);
  ctx.strokeStyle= invSearchFocus?'#7ea0d0':'#324768'; ctx.lineWidth=1; ctx.strokeRect(px, ry, pw, 18);
  ctx.fillStyle=invSearch?'#dfe8ff':'#5f6f86';
  ctx.fillText(invSearch? invSearch+(invSearchFocus?'|':'') : 'пошук… (клік, друкуй)', px+6, ry+9);
  invHit.search={x:px,y:ry,w:pw,h:18};
  ry+=26;

  // entries grid
  const list=filteredInventory();
  const cols=2, ew=(pw-6)/cols, eh=44;
  const listTop=ry;
  const visibleH = (y-26+panelH) - listTop - 4;
  const rows=Math.ceil(list.length/cols);
  const maxScroll=Math.max(0, rows*eh - visibleH);
  invScroll=Math.max(0, Math.min(maxScroll, invScroll));
  ctx.save();
  ctx.beginPath(); ctx.rect(px-8, listTop-2, pw+16, visibleH+4); ctx.clip();
  ctx.textBaseline='alphabetic';
  for(let i=0;i<list.length;i++){
    const k=list[i];
    const cx=px+(i%cols)*(ew+6), cyy=listTop + ((i/cols)|0)*eh - invScroll;
    if(cyy+eh<listTop-4 || cyy>listTop+visibleH+4) continue;
    const c=CUBES[k];
    const own=owned(k);
    const affordable = budgetUsed()+c.cost<=budgetCap();
    const usable = own>0 && affordable;
    const sel=selectedType===k;
    ctx.globalAlpha = usable?1:0.42;
    ctx.fillStyle = sel?'rgba(40,58,94,0.95)':'rgba(18,26,42,0.92)';
    ctx.fillRect(cx,cyy,ew,eh-4);
    ctx.strokeStyle = RARITY_COL[c.rarity]; ctx.lineWidth=sel?2.4:1.4; ctx.strokeRect(cx,cyy,ew,eh-4);
    // glyph swatch
    ctx.fillStyle=c.col; ctx.fillRect(cx+4,cyy+4,26,26);
    drawGlyph(c.glyph, cx+4+13, cyy+4+13, 26, c.tint, 1);
    // name + count + cost
    ctx.font='bold 11px system-ui'; ctx.fillStyle='#eaf0fb';
    ctx.fillText(c.name, cx+34, cyy+13);
    ctx.font='10px system-ui'; ctx.fillStyle=RARITY_COL[c.rarity];
    ctx.fillText('×'+(own===Infinity?'∞':own)+'  ·  '+c.cost+'◆', cx+34, cyy+25);
    ctx.font='9px system-ui'; ctx.fillStyle='#8fa0b8';
    let eff=c.eff; const maxw=ew-38;
    while(eff.length>4 && ctx.measureText(eff).width>maxw) eff=eff.slice(0,-2);
    if(eff!==c.eff) eff=eff.slice(0,-1)+'…';
    ctx.fillText(eff, cx+34, cyy+36);
    ctx.globalAlpha=1;
    invHit.entries.push({k,x:cx,y:cyy,w:ew,h:eh-4,usable});
  }
  ctx.restore();
  // scrollbar hint
  if(maxScroll>0){
    const sbH=visibleH*(visibleH/(rows*eh));
    const sbY=listTop + (invScroll/maxScroll)*(visibleH-sbH);
    ctx.fillStyle='rgba(120,150,190,0.4)'; ctx.fillRect(px+pw-3, sbY, 3, sbH);
  }
  if(list.length===0){ ctx.fillStyle='#6f7e94'; ctx.font='11px system-ui'; ctx.fillText('— нічого за фільтром. Відкрий лут.', px, listTop+16); }
}

      ctx.fillStyle='rgba(16,22,36,0.9)'; ctx.fillRect(x+18, ry, w-36, 36);
      ctx.strokeStyle=disc?col:'#324768'; ctx.lineWidth=1.4; ctx.strokeRect(x+18, ry, w-36, 36);

      ry+=40;
      if(ry>y+h-30){ ctx.fillStyle='#7e90ac'; ctx.font='10px system-ui'; ctx.fillText('…', x+18, ry); break; }
